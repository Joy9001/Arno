name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      # requires-python is ">=3.14"; pin the interpreter so the lockfile is reproducible.
      UV_PYTHON: "3.14"
      # A scratch database. conftest refuses any name that doesn't end in _test.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/fin_agent_test
      AGENT_RO_PASSWORD: agent_ro_test_password
      BACKUP_PASSWORD: backup_test_password
      # The runner may also have an older client; pin the one matching the server.
      PG_DUMP: /usr/lib/postgresql/18/bin/pg_dump
      PSQL: /usr/lib/postgresql/18/bin/psql
      PG_RESTORE: /usr/lib/postgresql/18/bin/pg_restore
      FIN_AGENT_RP_ID: localhost
      FIN_AGENT_RP_ORIGIN: http://localhost:8000
      FIN_AGENT_COOKIE_SECURE: "0"
      # Model requests are blocked: every role points at a closed loopback port, and conftest
      # refuses non-loopback sockets and DNS lookups.
      CHAT_BASE_URL: http://127.0.0.1:9/v1
      CHAT_MODEL: blocked-in-ci
      VISION_BASE_URL: http://127.0.0.1:9/v1
      VISION_MODEL: blocked-in-ci
      STT_BASE_URL: http://127.0.0.1:9/v1
      STT_MODEL: blocked-in-ci
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: fin_agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d fin_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --dev

      - name: Install PostgreSQL 18 client and restic
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          CODENAME=$(. /etc/os-release && echo "${VERSION_CODENAME}")
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18 restic jq

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Dependency vulnerability audit
        # Audit the lockfile, not the installed project: fin-agent itself is not on PyPI.
        run: |
          uv export --frozen --no-emit-project --format requirements-txt -q > "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --disable-pip -r "$RUNNER_TEMP/requirements.txt"

      - name: License audit
        run: uv run python scripts/license_audit.py --python-only

      - name: Pytest
        # The runner has 2 cores, so let xdist size itself rather than use the dev-machine N.
        run: uv run pytest -q -n auto

      - name: Validate compose file
        run: docker compose --env-file .env.example config -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level high

      - name: License audit
        run: python3 ../scripts/license_audit.py --web-only

      - name: Build
        run: pnpm build
