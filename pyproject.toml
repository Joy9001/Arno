[project]
name = "fin-agent"
version = "0.1.2"
description = "Private, self-hosted personal finance agent"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.121.1",
    "holidays>=0.80.0",
    "httpx>=0.28.0",
    "msoffcrypto-tool>=6.0.0",
    "olefile>=0.47",
    "pydantic>=2.11.0",
    "pydantic-ai>=2.64.0",
    "pydantic-ai-harness[code-mode]>=0.64.0",
    "pydantic-evals>=2.64.0",
    "pypdfium2>=5.0.0",
    "python-calamine>=0.5.0",
    "python-dateutil>=2.9.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "striprtf>=0.0.35",
    "pywebpush>=2.0.0",
    "typer>=0.19.0",
    "uvicorn[standard]>=0.37.0",
    "webauthn>=3.0.0",
    "segno>=1.6.6",
    "opentelemetry-api==1.45.2",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "arize-phoenix-otel>=0.17.2",
]

[project.scripts]
fin-agent = "fin_agent.cli:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "cbor2>=5.6.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "pip-audit>=2.9.0",
    "pyrefly==1.4.1",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.0",
    "types-python-dateutil>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fin_agent"]

[tool.ruff]
line-length = 100
# docs/ holds research probes that become tests at L2; they are not shipped code.
extend-exclude = ["*.md", "docs", "evals", ".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Eight workers measured fastest on the 12-core dev box; Postgres, not the CPU, is the limit.
# `-n 0` still runs serially. The `cluster` group (cluster-wide DDL, fixed database names)
# always runs on one worker.
addopts = "-n 8 --dist loadgroup"

[tool.pyrefly]
# Type-checking policy: docs/fin-agent/typing.md. CI fails on any error or warning.
project-includes = ["src", "tests", "evals", "scripts"]
search-path = ["src", "."]
python-version = "3.14"
# The app ships in a Linux image; check that platform on every dev machine too.
python-platform = "linux"
preset = "strict"
min-severity = "warn"
# Only `# pyrefly: ignore[<code>]` suppresses, never a blanket `# type: ignore`.
enabled-ignores = ["pyrefly"]

[tool.pyrefly.errors]
deprecated = "error"
untyped-import = "error"
# Off for now: `int()`/`str()` at trust boundaries (sandbox calls, JSON, rows) normalize values
# whose annotations are still `Any`-adjacent. Re-enable when row and tool payloads are typed.
unnecessary-type-conversion = false

# Sub-configs: the first match wins for each key, so specific paths come first.

# The pure money core: no database rows, so no `Any`, and no truthiness on amounts or dates
# (`if amount:` treats a real ₹0 like a missing value).
[[tool.pyrefly.sub-config]]
matches = "src/fin_agent/engine/projection.py"

[tool.pyrefly.sub-config.errors]
explicit-any = true
implicit-bool = true
no-any-return = true
unannotated-return = true
unknown-return-type = true
implicitly-defined-attribute = true
implicit-reexport = true

[[tool.pyrefly.sub-config]]
matches = "src/fin_agent/engine/money.py"

[tool.pyrefly.sub-config.errors]
explicit-any = true
implicit-bool = true
no-any-return = true
unannotated-return = true
unknown-return-type = true
implicitly-defined-attribute = true
implicit-reexport = true

[[tool.pyrefly.sub-config]]
matches = "src/fin_agent/india/**"

[tool.pyrefly.sub-config.errors]
explicit-any = true
implicit-bool = true
no-any-return = true
unannotated-return = true
unknown-return-type = true
implicitly-defined-attribute = true
implicit-reexport = true

[[tool.pyrefly.sub-config]]
matches = "src/**"

[tool.pyrefly.sub-config.errors]
no-any-return = true
unannotated-return = true
unknown-return-type = true
implicitly-defined-attribute = true
implicit-reexport = true

[[tool.pyrefly.sub-config]]
matches = "tests/**"

[tool.pyrefly.sub-config.errors]
# Pytest fixtures arrive as unannotated parameters; annotating each one adds no safety.
implicit-any = false
