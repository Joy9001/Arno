[project]
name = "fin-agent"
version = "0.1.1"
description = "Private, self-hosted personal finance agent"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "fastapi>=0.118.0",
    "holidays>=0.80.0",
    "httpx>=0.28.0",
    "msoffcrypto-tool>=6.0.0",
    "olefile>=0.47",
    "pydantic>=2.11.0",
    "pydantic-ai>=2.64.0",
    "pydantic-ai-harness[code-mode]>=0.64.0",
    "pydantic-evals>=2.64.0",
    "pypdfium2>=5.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "python-calamine>=0.5.0",
    "python-dateutil>=2.9.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "striprtf>=0.0.35",
    "pywebpush>=2.0.0",
    "typer>=0.19.0",
    "uvicorn[standard]>=0.37.0",
    "webauthn>=3.0.0",
    "segno>=1.6.6",
    "openinference-instrumentation-pydantic-ai>=0.1.0",
]

[project.scripts]
fin-agent = "fin_agent.cli:app"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[dependency-groups]
dev = [
    "cbor2>=5.6.0",
    "cryptography>=44.0.0",
    "httpx>=0.28.0",
    "pip-audit>=2.9.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.14.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fin_agent"]

[tool.ruff]
line-length = 100
# docs/ holds research probes that become tests at L2; they are not shipped code.
extend-exclude = ["*.md", "docs", "evals", ".venv", "web"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
