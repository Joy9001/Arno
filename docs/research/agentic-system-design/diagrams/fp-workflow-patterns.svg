<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fp-workflow-patterns-title fp-workflow-patterns-desc" id="fp-workflow-patterns-root">
        <title id="fp-workflow-patterns-title">Anthropic's workflow patterns: chaining, routing, evaluator-optimizer</title>
        <desc id="fp-workflow-patterns-desc">Three mini-flows from Anthropic's catalog: prompt chaining with a code gate, routing by an LLM classifier, and an evaluator-optimizer feedback loop.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fp-workflow-patterns-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #fp-workflow-patterns-root { font-family: var(--font-sans); color: var(--color-ink); }
      #fp-workflow-patterns-root .diagram-container { width: 100%; overflow-x: auto; }
      #fp-workflow-patterns-root .diagram-container { overflow-x: visible; }</style>
