        <title id="arch-reference-architecture-agent-output-title">Agent loop and output guardrails</title>
        <desc id="arch-reference-architecture-agent-output-desc">After the model call: the optional agent loop with write tools gated by human approval, then output guardrails whose failures retry on a fallback model or hand off to a human.</desc>
