<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ma-protocol-layers-title ma-protocol-layers-desc" id="ma-protocol-layers-root">
        <title id="ma-protocol-layers-title">Protocol layering: A2A between agents, MCP below to tools</title>
        <desc id="ma-protocol-layers-desc">Architecture diagram showing two agents owned by different teams connected by A2A across the ownership boundary, each reaching its own tools and data through MCP.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ma-protocol-layers-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ma-protocol-layers-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ma-protocol-layers-root .diagram-container { width: 100%; overflow-x: auto; }
      #ma-protocol-layers-root .diagram-container { overflow-x: visible; }</style>
