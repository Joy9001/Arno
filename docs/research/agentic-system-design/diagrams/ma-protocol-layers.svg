        <text x="40" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">Same codebase or ownership?</text>
        <text x="40" y="438" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">A function call, queue or HTTP API is enough.</text>
        <text x="500" y="420" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">A2A earns its keep at real ownership / trust boundaries;</text>
        <text x="500" y="438" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">identity, authorization, delegation tracking and audit</text>
        <text x="500" y="456" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" text-anchor="start">across them remain unresolved.</text>
