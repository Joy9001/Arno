<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="readme-survey-map-title readme-survey-map-desc" id="readme-survey-map-root">
      <title id="readme-survey-map-title">Survey map · Where each file sits</title>
      <desc id="readme-survey-map-desc">Layer stack placing the survey's topic files: vocabulary and patterns on top, then the request path, agent layer and retrieval and memory inside an operations boundary, with case studies and the framework landscape outside the stack as evidence and tooling.</desc>
      <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #readme-survey-map-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #readme-survey-map-root { font-family: var(--font-sans); color: var(--color-ink); }
      #readme-survey-map-root .scroll { overflow-x: auto; }</style>
        <pattern id="readme-survey-map-readme-survey-map-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>
      <rect width="100%" height="100%" fill="url(#readme-survey-map-readme-survey-map-dots)" opacity="0.55"/>

      <!-- Direction column (left margin) -->
      <text x="80" y="48" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="middle">CONCEPTS</text>
      <line x1="80" y1="56" x2="80" y2="356" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
      <polygon points="76,356 84,356 80,364" fill="#4f5d75"/>
      <text x="80" y="380" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="middle">DATA</text>

      <!-- L1 — Vocabulary & patterns -->
      <rect x="120" y="56" width="780" height="64" fill="#ffffff" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
      <text x="140" y="92" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
      <text x="180" y="86" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Vocabulary &amp; patterns</text>
      <text x="180" y="104" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">workflow vs agent · who controls the next step</text>
      <text x="880" y="96" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">foundations-and-patterns.md</text>

      <!-- Operations boundary (wraps the three system layers) -->
      <rect x="120" y="140" width="780" height="236" rx="6" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
      <rect x="136" y="132" width="148" height="16" fill="#f5f5f5"/>
      <text x="144" y="144" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">WRAPPED BY OPERATIONS</text>
      <rect x="692" y="132" width="196" height="16" fill="#f5f5f5"/>
      <text x="880" y="144" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">production-and-operations.md</text>

      <!-- L2 — Request path -->
      <rect x="136" y="160" width="748" height="64" fill="#f5f5f5" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
      <text x="156" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
      <text x="196" y="190" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Request path</text>
      <text x="196" y="208" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">gateway · guardrails · cache · router · context · model gateway</text>
      <text x="864" y="200" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">genai-system-architecture.md</text>

      <!-- L3 — Agent layer (FOCAL) -->
      <rect x="136" y="224" width="748" height="64" fill="#bf4520" fill-opacity="0.08"/>
      <rect x="136" y="224" width="748" height="64" fill="none" stroke="#bf4520" stroke-width="1"/>
      <text x="156" y="260" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" font-weight="600">03</text>
      <text x="196" y="254" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Agent layer</text>
      <text x="196" y="272" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">one loop, or several agents over MCP / A2A</text>
      <text x="864" y="264" fill="#bf4520" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">multi-agent-systems.md</text>

      <!-- L4 — Retrieval & memory -->
      <rect x="136" y="288" width="748" height="64" fill="#ececec" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
      <text x="156" y="324" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">04</text>
      <text x="196" y="318" fill="#2d3142" font-size="16" font-weight="600" font-family="'Geist', sans-serif">Retrieval &amp; memory</text>
      <text x="196" y="336" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif">hybrid search · rerank · GraphRAG · memory stores</text>
      <text x="864" y="328" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.04em">retrieval-and-memory.md</text>

      <!-- Outside the stack -->
      <text x="120" y="420" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">OUTSIDE THE STACK</text>
      <line x1="120" y1="428" x2="900" y2="428" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>

      <rect x="120" y="444" width="380" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="136" y="456" width="68" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
      <text x="170" y="467" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">EVIDENCE</text>
      <text x="136" y="492" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">18 production systems</text>
      <text x="136" y="508" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.04em">case-studies.md</text>

      <rect x="520" y="444" width="380" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="536" y="456" width="64" height="16" rx="2" fill="none" stroke="#2d3142" stroke-width="1" stroke-opacity="0.30"/>
      <text x="568" y="467" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">TOOLING</text>
      <text x="536" y="492" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Frameworks, serving research, benchmarks</text>
      <text x="536" y="508" fill="#4f5d75" font-size="10" font-family="'Geist Mono', monospace" letter-spacing="0.04em">research-and-landscape.md</text>

      <!-- Caption -->
      <text x="120" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
      <text x="216" y="560" fill="#4f5d75" font-size="11" font-family="'Instrument Serif', serif" font-style="italic">The agent layer is the survey's subject; the dashed boundary marks the concerns that wrap every layer inside it.</text>
    </svg>
