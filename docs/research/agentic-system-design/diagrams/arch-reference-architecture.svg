        <title id="arch-reference-architecture-title">Reference GenAI architecture, layer view</title>
        <desc id="arch-reference-architecture-desc">Request path from client through gateway, orchestrator and LLM gateway to the model pools, then the optional agent loop, output guardrails, client stream and data flywheel, with cross-cutting concerns spanning every layer.</desc>
