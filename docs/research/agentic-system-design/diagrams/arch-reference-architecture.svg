      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #arch-reference-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #arch-reference-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #arch-reference-architecture-root .diagram-container { overflow-x: visible; }</style>
