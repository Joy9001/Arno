        <title id="rl-agent-design-search-loop-title">Automated agent design loop</title>
        <desc id="rl-agent-design-search-loop-desc">Flowchart of the propose, evaluate, archive, select and mutate cycle shared by ADAS, AFlow, GEPA, DGM and HGM, with the exit that returns the best archived candidate.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rl-agent-design-search-loop-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #rl-agent-design-search-loop-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rl-agent-design-search-loop-root .diagram-container { width: 100%; overflow-x: auto; }
      #rl-agent-design-search-loop-root .diagram-container { overflow-x: visible; }</style>
