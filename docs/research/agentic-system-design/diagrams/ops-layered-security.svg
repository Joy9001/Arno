<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ops-layered-security-title ops-layered-security-desc" id="ops-layered-security-root">
        <title id="ops-layered-security-title">Layered agent security: construction over detection</title>
        <desc id="ops-layered-security-desc">Layer stack from untrusted content through probabilistic filters, a Rule of Two gate and a deterministic layer of patterns, gateway policy and least-privilege auth to the tools, showing what each layer cannot guarantee.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ops-layered-security-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ops-layered-security-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ops-layered-security-root .diagram-container { width: 100%; overflow-x: auto; }
      #ops-layered-security-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ops-layered-security-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ops-layered-security-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ops-layered-security-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<line x1="120" y1="68" x2="120" y2="96" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-layered-security-arrow)"/>
<line x1="120" y1="148" x2="120" y2="176" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-layered-security-arrow)"/>
<line x1="120" y1="228" x2="120" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-layered-security-arrow)"/>
<line x1="120" y1="428" x2="120" y2="456" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-layered-security-arrow)"/>
<rect x="130" y="76" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="156" y="85" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FILTERED</text>
<rect x="130" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="162" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BYPASSABLE</text>
<rect x="130" y="236" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="170" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">≤2 OF A, B, C</text>
<rect x="130" y="436" width="84" height="12" rx="2" fill="#f5f5f5"/><text x="172" y="445" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERMITTED ONLY</text>
<rect x="56" y="32" width="848" height="36" rx="6" fill="#f5f5f5"/><rect x="56" y="32" width="848" height="36" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/><text x="480" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"></text><text x="72" y="55" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Untrusted content</text><text x="288" y="54" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">web page, email, tool output</text><rect x="56" y="96" width="848" height="52" rx="6" fill="#f5f5f5"/><rect x="56" y="96" width="848" height="52" rx="6" fill="#2d3142" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/><text x="480" y="120" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"></text><rect x="72" y="103" width="96" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="120" y="112" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L1 · PROBABILISTIC</text><text x="72" y="136" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Filters and validators</text><text x="288" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Classifiers, filters, validators</text><text x="288" y="131" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">(Llama Guard, injection detectors)</text><text x="616" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Limit: adaptive attacks &gt;90% success on</text><text x="616" y="125" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">most of 12 defenses; human red-teaming 100%</text><text x="616" y="137" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Useful, not a security boundary</text><rect x="56" y="176" width="848" height="52" rx="6" fill="#f5f5f5"/><rect x="56" y="176" width="848" height="52" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="480" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"></text><rect x="72" y="183" width="56" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.45" stroke-width="0.8"/><text x="100" y="192" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L2 · GATE</text><text x="72" y="216" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Rule of Two check</text><text x="288" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Per session, at most two of:</text><text x="288" y="205" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">A untrusted input, B sensitive data or</text><text x="288" y="217" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">systems, C state change or external communication</text><text x="616" y="199" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">All three needed: human approval or</text><text x="616" y="211" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">another reliable check</text><rect x="56" y="256" width="848" height="172" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="72" y="273" fill="#4f5d75" font-size="8" letter-spacing="0.12em" font-family="'Geist Mono', monospace" text-anchor="start">DETERMINISTIC LAYER · THE GUARANTEE COMES FROM WHAT THE AGENT CANNOT DO</text><line x1="64" y1="328" x2="896" y2="328" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><line x1="64" y1="376" x2="896" y2="376" stroke="rgba(45,49,66,0.12)" stroke-width="1"/><rect x="72" y="287" width="20" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="82" y="296" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L3</text><text x="72" y="316" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Architectural patterns</text><text x="288" y="301" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Action-Selector, Plan-Then-Execute, Dual LLM,</text><text x="288" y="313" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">CaMeL (capabilities attached to data)</text><rect x="72" y="335" width="20" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="82" y="344" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L4</text><text x="72" y="364" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Gateway policy engine</text><text x="288" y="349" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">e.g. Cedar: default-deny,</text><text x="288" y="361" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">forbid overrides permit, audit log</text><rect x="72" y="383" width="20" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="82" y="392" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L5</text><text x="72" y="412" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Least-privilege auth</text><text x="288" y="397" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Audience-bound OAuth tokens;</text><text x="288" y="409" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">short-lived, task-scoped credentials</text><rect x="56" y="456" width="848" height="36" rx="6" fill="#f5f5f5"/><rect x="56" y="456" width="848" height="36" rx="6" fill="#2d3142" stroke="rgba(45,49,66,0.30)" stroke-width="1" fill-opacity="0.03"/><text x="480" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"></text><text x="72" y="479" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Tools and external systems</text><text x="288" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">only permitted calls reach them</text><line x1="56" y1="516" x2="904" y2="516" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="56" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text><rect x="56" y="547" width="24" height="10" rx="2" fill="#2d3142" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02"/><text x="90" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Probabilistic filter</text><rect x="204" y="547" width="24" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="238" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate</text><rect x="300" y="547" width="24" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/><text x="334" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text><rect x="396" y="547" width="24" height="10" rx="2" fill="#2d3142" stroke="rgba(45,49,66,0.30)" stroke-width="1" fill-opacity="0.03"/><text x="430" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Tools</text><line x1="492" y1="552" x2="518" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-layered-security-arrow)"/><text x="526" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow of untrusted input</text>
      </svg>
