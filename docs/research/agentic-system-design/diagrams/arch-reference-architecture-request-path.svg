<text x="368" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">exact, then semantic</text>
<text x="368" y="233" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">provider cache comes later</text>
