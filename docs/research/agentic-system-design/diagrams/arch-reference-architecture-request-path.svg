        <title id="arch-reference-architecture-request-path-title">Request path: orchestrator to model pools</title>
        <desc id="arch-reference-architecture-request-path-desc">The four orchestrator stages (input guardrails, cache lookup, router, context construction), the conversation store, and the hand-off through the LLM gateway to the model pools.</desc>
