" font-family="'Helvetica'">control-flow exception</text></g><g class="entity" data-qualified-name="S4" id="ent0004" data-source-line="25"><rect x="251.94" y="511.227" width="204.514" height="65.398" fill="#FFEDD5" style="stroke:#EA580C;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="251.94" y1="566.625" x2="456.454" y2="566.625" style="stroke:#EA580C;stroke-width:0.5;"/><text x="261.94" y="528.294" fill="#000" font-size="13" textLength="47.068" font-family="'Helvetica'">Paused</text><text x="261.94" y="543.427" fill="#000" font-size="13" textLength="184.514" font-family="'Helvetica'">state saved by checkpointer</text><text x="261.94" y="558.559" fill="#000" font-size="13" textLength="110.754" font-family="'Helvetica'">waits indefinitely</text></g><g class="entity" data-qualified-name="S5" id="ent0005" data-source-line="26"><rect x="286.68" y="665.627" width="135.039" height="50.266" fill="#FEE2E2" style="stroke:#DC2626;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="286.68" y1="705.892" x2="421.719" y2="705.892" style="stroke:#DC2626;stroke-width:0.5;"/><text x="296.68" y="682.694" fill="#000" font-size="13" textLength="115.039" font-family="'Helvetica'">Node re-executes</text><text x="296.68" y="697.827" fill="#000" font-size="13" textLength="107.282" font-family="'Helvetica'">from its first line</text></g><g class="entity" data-qualified-name="S6" id="ent0006" data-source-line="27"><rect x="229.54" y="776.887" width="249.315" height="50" fill="#FEE2E2" style="stroke:#DC2626;stroke-width:0.5;" rx="12.5" ry="12.5"/><line x1="229.54" y1="802.02" x2="478.855" y2="802.02" style="stroke:#DC2626;stroke-width:0.5;"/><text x="239.54" y="793.954" fill="#000" font-size="13" textLength="229.315" font-family="'Helvetica'">Code before interrupt() runs AGAIN</text></g><g class="entity" data-qualified-name="S7" id="ent0007" data-source-line="28"><rect x="233.33" y="901.887" width="241.749" height="50.266" fill="#DCFCE7" style="stroke:#16A34A;stroke-width:0.5;" rx="12.5" ry="