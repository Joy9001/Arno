<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ops-hitl-interrupt-resume-title ops-hitl-interrupt-resume-desc" id="ops-hitl-interrupt-resume-root">
        <title id="ops-hitl-interrupt-resume-title">LangGraph interrupt and resume: the node runs twice</title>
        <desc id="ops-hitl-interrupt-resume-desc">Lifecycle phase map of a LangGraph node that pauses at interrupt(), is saved by the checkpointer, and on resume re-executes from its first line so code before interrupt() runs again.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ops-hitl-interrupt-resume-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ops-hitl-interrupt-resume-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ops-hitl-interrupt-resume-root .diagram-container { width: 100%; overflow-x: auto; }
      #ops-hitl-interrupt-resume-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ops-hitl-interrupt-resume-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ops-hitl-interrupt-resume-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ops-hitl-interrupt-resume-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<rect x="24" y="36" width="912" height="132" rx="8" fill="#4f5d75" stroke="rgba(45,49,66,0.12)" fill-opacity="0.035"/>
<rect x="24" y="412" width="912" height="92" rx="8" fill="#2d3142" stroke="rgba(45,49,66,0.12)" fill-opacity="0.035"/>
<text x="40" y="56" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WAIT / INTERRUPTION</text>
<text x="40" y="216" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">PRIMARY PHASES</text>
<text x="40" y="432" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TERMINAL OUTCOME</text>
<line x1="184" y1="272" x2="232" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-hitl-interrupt-resume-arrow)"/>
<line x1="544" y1="272" x2="592" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-hitl-interrupt-resume-arrow)"/>
<line x1="724" y1="272" x2="772" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-hitl-interrupt-resume-arrow)"/>
<path d="M298 224 L298 204 Q298 196 306 196 L316 196 Q324 196 324 188 L324 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-hitl-interrupt-resume-arrow)"/>
<path d="M452 136 L452 188 Q452 196 460 196 L470 196 Q478 196 478 204 L478 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-hitl-interrupt-resume-arrow)"/>
<path d="M838 320 L838 428" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-hitl-interrupt-resume-arrow)"/>
<rect x="188" y="252" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="208" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS 1</text>
<rect x="548" y="252" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="568" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASS 2</text>
<rect x="732" y="252" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="748" y="261" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">THEN</text>
<rect x="268" y="146" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="155" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PERSIST</text>
<rect x="460" y="146" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="155" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESUME</text>
<rect x="846" y="368" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="862" y="377" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text><rect x="52" y="224" width="132" height="96" rx="6" fill="#f5f5f5"/><rect x="52" y="224" width="132" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="118" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run node</text><text x="118" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">code before</text><text x="118" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interrupt() runs</text><rect x="232" y="224" width="132" height="96" rx="6" fill="#f5f5f5"/><rect x="232" y="224" width="132" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="298" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">interrupt()</text><text x="298" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raises a control-</text><text x="298" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">flow exception</text><rect x="412" y="224" width="132" height="96" rx="6" fill="#f5f5f5"/><rect x="412" y="224" width="132" height="96" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="478" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Re-execute</text><text x="478" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restarts at first</text><text x="478" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">line; code before</text><text x="478" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interrupt() runs</text><text x="478" y="309" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AGAIN</text><rect x="592" y="224" width="132" height="96" rx="6" fill="#f5f5f5"/><rect x="592" y="224" width="132" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="658" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resumes</text><text x="658" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interrupt() returns</text><text x="658" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the resume value,</text><text x="658" y="296" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">matched by position</text><rect x="772" y="224" width="132" height="96" rx="6" fill="#f5f5f5"/><rect x="772" y="224" width="132" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="838" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Continue</text><text x="838" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">code after</text><text x="838" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">interrupt() runs</text><rect x="288" y="60" width="200" height="76" rx="6" fill="#f5f5f5"/><rect x="288" y="60" width="200" height="76" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/><rect x="296" y="66" width="32" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="312" y="75" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WAIT</text><text x="388" y="94" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Paused</text><text x="388" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">state saved by checkpointer</text><text x="388" y="120" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">under thread_id;</text><text x="388" y="132" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">waits indefinitely</text><rect x="772" y="428" width="132" height="64" rx="6" fill="#f5f5f5"/><rect x="772" y="428" width="132" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><rect x="780" y="434" width="52" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.45" stroke-width="0.8"/><text x="806" y="443" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TERMINAL</text><text x="838" y="470" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Node completes</text><text x="310" y="366" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">A bare try/except around interrupt() swallows</text><text x="310" y="382" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the exception and breaks the pause</text><path d="M 298 352 Q 296 338 298 324" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="298" cy="324" r="2" fill="#2d3142"/><text x="472" y="366" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Side effects before interrupt() repeat on resume:</text><text x="472" y="382" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">keep them idempotent, move them after</text><text x="472" y="398" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">interrupt(), or put them in a separate node</text><path d="M 478 352 Q 480 338 478 324" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/><circle cx="478" cy="324" r="2" fill="#2d3142"/><line x1="56" y1="528" x2="904" y2="528" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="56" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text><rect x="56" y="559" width="24" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="90" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Phase</text><rect x="152" y="559" width="24" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="186" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Re-executed code</text><rect x="302" y="559" width="24" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/><text x="336" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Wait state</text><rect x="418" y="559" width="24" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><text x="452" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Terminal</text><line x1="528" y1="564" x2="554" y2="564" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-hitl-interrupt-resume-arrow)"/><text x="562" y="567" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Transition</text>
      </svg>
