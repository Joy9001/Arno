        <title id="fp-workflow-patterns-fanout-title">Anthropic's workflow patterns: parallelization vs orchestrator-workers</title>
        <desc id="fp-workflow-patterns-fanout-desc">Two fan-out patterns from Anthropic's catalog: parallelization with a fixed split and code aggregation, versus an orchestrator LLM that sets subtasks at runtime and a synthesis step.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fp-workflow-patterns-fanout-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #fp-workflow-patterns-fanout-root { font-family: var(--font-sans); color: var(--color-ink); }
