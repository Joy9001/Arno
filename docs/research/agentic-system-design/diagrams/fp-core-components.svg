<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fp-core-components-title fp-core-components-desc" id="fp-core-components-root">
        <title id="fp-core-components-title">Core components of an agentic system</title>
        <desc id="fp-core-components-desc">Architecture diagram of an agentic system: instructions guide the model inside orchestration, guardrails gate tool calls into the environment, results feed back to the model, with memory and human oversight attached.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fp-core-components-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #fp-core-components-root { font-family: var(--font-sans); color: var(--color-ink); }
      #fp-core-components-root .diagram-container { width: 100%; overflow-x: auto; }
      #fp-core-components-root .diagram-container { overflow-x: visible; }</style>
