        <text x="196.0" y="63" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Rules suffice or one-shot task?</text>
        <text x="196.0" y="76" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">predictable; summarize,</text>
        <text x="196.0" y="89" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">translate, classify</text>
        <polygon points="54,40 60,46 54,52 48,46" fill="none" stroke="#2d3142" stroke-width="1"/>
        <rect x="40" y="140" width="312" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="140" width="312" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="196.0" y="173.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Decomposes into fixed subtasks?</text>
        <text x="196.0" y="186.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">predictability is needed</text>
        <polygon points="54,144 60,150 54,156 48,150" fill="none" stroke="#2d3142" stroke-width="1"/>
        <rect x="40" y="244" width="312" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="244" width="312" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="196.0" y="271" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Open-ended, steps unpredictable?</text>
        <text x="196.0" y="284" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">model decisions trusted,</text>
        <text x="196.0" y="297" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">trusted environment</text>
        <polygon points="54,248 60,254 54,260 48,254" fill="none" stroke="#2d3142" stroke-width="1"/>
        <rect x="40" y="348" width="312" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="348" width="312" height="72" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <text x="196.0" y="375" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Single agent can't reliably cope?</text>
        <text x="196.0" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">prompt complexity, tool overload,</text>
        <text x="196.0" y="401" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">security boundaries</text>
        <polygon points="54,352 60,358 54,364 48,358" fill="none" stroke="#2d3142" stroke-width="1"/>
        <rect x="424" y="36" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="36" width="280" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="564.0" y="69.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Deterministic or optimized LLM call</text>
        <text x="564.0" y="82.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">retrieval + in-context examples</text>
        <rect x="424" y="140" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="140" width="280" height="72" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="564.0" y="167" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Workflow</text>
        <text x="564.0" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chaining, routing, parallelization,</text>
        <text x="564.0" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">evaluator-optimizer (predefined code paths)</text>
        <rect x="424" y="244" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="244" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="564.0" y="277.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Single agent with tools</text>
        <text x="564.0" y="290.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">iteration limits, sandbox, guardrails</text>
        <rect x="424" y="348" width="280" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="424" y="348" width="280" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="564.0" y="375" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Multi-agent</text>
        <text x="564.0" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">orchestrator-workers when subtasks</text>
        <text x="564.0" y="401" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">can't be predicted</text>
        <circle cx="704" cy="280" r="2" fill="#2d3142"/>
        <line x1="708" y1="280" x2="728" y2="280" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <text x="736" y="260" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Irreversible actions (deleting</text>
        <text x="736" y="276" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">records, moving money): explicit</text>
        <text x="736" y="292" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">human approval. Pilot a low-risk,</text>
        <text x="736" y="308" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">reversible workflow.</text>
        <circle cx="704" cy="384" r="2" fill="#2d3142"/>
        <line x1="708" y1="384" x2="728" y2="384" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <text x="736" y="364" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Caution: not when all agents need</text>
        <text x="736" y="380" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">the same context, many</text>
        <text x="736" y="396" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">dependencies, or most coding</text>
        <text x="736" y="412" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">tasks (Anthropic); Cognition</text>
        <text x="736" y="428" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">calls multi-agent currently</text>
        <text x="736" y="444" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">fragile.</text>
