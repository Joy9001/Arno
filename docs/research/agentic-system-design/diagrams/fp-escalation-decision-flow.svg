<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fp-escalation-decision-flow-title fp-escalation-decision-flow-desc" id="fp-escalation-decision-flow-root">
        <title id="fp-escalation-decision-flow-title">Start simple, escalate on measured evidence</title>
        <desc id="fp-escalation-decision-flow-desc">Flowchart of four questions that move from a deterministic solution to a workflow, a single agent and multi-agent only when evidence shows the simpler level falls short, with cautions on multi-agent and irreversible actions.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #fp-escalation-decision-flow-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #fp-escalation-decision-flow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #fp-escalation-decision-flow-root .diagram-container { width: 100%; overflow-x: auto; }
      #fp-escalation-decision-flow-root .diagram-container { overflow-x: visible; }</style>
