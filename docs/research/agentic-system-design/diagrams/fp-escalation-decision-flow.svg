        <text x="144" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">decision question</text>
        <rect x="290" y="550" width="16" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="314" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">code decides next step</text>
