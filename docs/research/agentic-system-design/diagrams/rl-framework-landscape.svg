<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rl-framework-landscape-title rl-framework-landscape-desc" id="rl-framework-landscape-root">
        <title id="rl-framework-landscape-title">Framework and platform landscape by abstraction level</title>
        <desc id="rl-framework-landscape-desc">Layer stack of managed platforms, graph frameworks, agent SDKs and the raw LLM API, with the protocol layer alongside and DSPy orthogonal.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rl-framework-landscape-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #rl-framework-landscape-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rl-framework-landscape-root .diagram-container { width: 100%; overflow-x: auto; }
      #rl-framework-landscape-root .diagram-container { overflow-x: visible; }</style>
          <marker id="rl-framework-landscape-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="rl-framework-landscape-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="rl-framework-landscape-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="rl-framework-landscape-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#rl-framework-landscape-dots)" opacity="0.55"/> -->

        <rect x="96" y="56" width="584" height="336" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<line x1="96" y1="140" x2="680" y2="140" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
<line x1="96" y1="224" x2="680" y2="224" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
<line x1="96" y1="308" x2="680" y2="308" stroke="#2d3142" stroke-width="1" stroke-opacity="0.12"/>
<text x="110" y="78" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L4</text>
<text x="140" y="94" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Managed</text>
<text x="140" y="110" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">platforms</text>
<text x="320" y="78" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Amazon Bedrock AgentCore · Microsoft Foundry Agent Service</text>
<text x="320" y="92" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Gemini Enterprise Agent Platform · Databricks Agent Bricks</text>
<text x="320" y="106" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Hosted harnesses: OpenAI Agents API, Anthropic Managed Agents</text>
<text x="320" y="124" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">AgentCore and Foundry host any framework</text>
<text x="110" y="162" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L3</text>
<text x="140" y="178" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Graph / workflow</text>
<text x="140" y="194" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">frameworks</text>
<text x="320" y="178" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">LangGraph · Google ADK 2.0 · Microsoft Agent Framework</text>
<text x="320" y="192" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">LlamaIndex Workflows · Mastra · CrewAI (Crews + Flows)</text>
<text x="110" y="246" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L2</text>
<text x="140" y="262" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Agent SDKs</text>
<text x="140" y="278" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">and libraries</text>
<text x="320" y="262" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">OpenAI Agents SDK · Claude Agent SDK</text>
<text x="320" y="276" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Pydantic AI · smolagents</text>
<text x="110" y="330" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">L1</text>
<text x="140" y="354" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Raw LLM API</text>
<text x="320" y="346" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Anthropic: start here, many patterns take</text>
<text x="320" y="360" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">only a few lines of code</text>
<line x1="60" y1="384" x2="60" y2="90" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rl-framework-landscape-arrow)"/>
<text x="40" y="64" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">MORE</text>
<text x="40" y="76" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">MANAGED</text>
<text x="40" y="396" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">LESS</text>
<rect x="704" y="56" width="216" height="336" rx="6" fill="#f5f5f5"/>
<rect x="704" y="56" width="216" height="336" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<rect x="716" y="68" width="56" height="12" rx="2" fill="none" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.50"/>
<text x="744" y="77" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALONGSIDE</text>
<text x="720" y="102" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">Protocol layer</text>
<text x="720" y="116" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">not a level of the stack</text>
<text x="720" y="142" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">MCP</text>
<text x="720" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">agent to tools</text>
<text x="720" y="186" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">A2A</text>
<text x="720" y="199" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">agent to agent</text>
<text x="720" y="230" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">Agent Skills</text>
<text x="720" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">instruction bundles</text>
<text x="720" y="274" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600">AG-UI</text>
<text x="720" y="287" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">agent to UI event stream</text>
<line x1="720" y1="310" x2="904" y2="310" stroke="#bf4520" stroke-width="0.8" stroke-opacity="0.30"/>
<text x="720" y="328" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Gateways wrap tools as MCP;</text>
<text x="720" y="341" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">runtimes list A2A. Every</text>
<text x="720" y="354" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">framework lists MCP.</text>
<rect x="96" y="416" width="584" height="60" rx="6" fill="#f5f5f5"/>
<rect x="96" y="416" width="584" height="60" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
<rect x="108" y="426" width="60" height="12" rx="2" fill="none" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.40"/>
<text x="138" y="435" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORTHOGONAL</text>
<text x="140" y="458" fill="#2d3142" font-size="14" font-family="'Geist', sans-serif" font-weight="600">DSPy</text>
<text x="320" y="444" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif">Optimises prompts; can sit inside other frameworks</text>
<text x="320" y="460" fill="#5a6580" font-size="9" font-family="'Geist Mono', monospace">not an orchestrator</text>
<line x1="40" y1="524" x2="920" y2="524" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
<text x="40" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="40" y="556" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="62" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Level of the stack, ordered by how much the platform manages</text>
<rect x="370" y="556" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="392" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Sits alongside the levels</text>
<rect x="560" y="556" width="14" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" fill-opacity="0.02" stroke-opacity="0.20"/>
<text x="582" y="564" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Orthogonal to the stack</text>

      </svg>
