<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rl-agent-serving-pause-title rl-agent-serving-pause-desc" id="rl-agent-serving-pause-root">
        <title id="rl-agent-serving-pause-title">Why agent workloads stress LLM serving</title>
        <desc id="rl-agent-serving-pause-desc">Sequence of one agent step: two LLM calls with a tool call between them, the idle tool-latency window, and the systems that intervene.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rl-agent-serving-pause-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #rl-agent-serving-pause-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rl-agent-serving-pause-root .diagram-container { width: 100%; overflow-x: auto; }
      #rl-agent-serving-pause-root .diagram-container { overflow-x: visible; }</style>
