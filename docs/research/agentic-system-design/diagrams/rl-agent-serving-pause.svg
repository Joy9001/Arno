<rect x="154" y="118" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="186" y="127" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LLM CALL 1</text>
<rect x="316" y="146" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="342" y="155" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILD KV</text>
<rect x="156" y="174" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="186" y="183" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>
<rect x="312" y="222" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="338" y="231" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RUN TOOL</text>
<rect x="304" y="366" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="338" y="375" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOL RESULT</text>
<rect x="154" y="414" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="186" y="423" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LLM CALL 2</text>
<rect x="304" y="442" width="76" height="12" rx="2" fill="#f5f5f5"/>
<text x="342" y="451" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REUSE PREFIX</text>
<rect x="152" y="470" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="186" y="479" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT OUTPUT</text>
<rect x="48" y="40" width="128" height="48" rx="6" fill="#f5f5f5"/>
<rect x="48" y="40" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="112" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Agent program</text>
<text x="112" y="77" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orchestration</text>
<rect x="200" y="40" width="128" height="48" rx="6" fill="#f5f5f5"/>
<rect x="200" y="40" width="128" height="48" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="264" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">LLM server</text>
<text x="264" y="77" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPU</text>
<rect x="352" y="40" width="128" height="48" rx="6" fill="#f5f5f5"/>
<rect x="352" y="40" width="128" height="48" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
<text x="416" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">KV cache</text>
<text x="416" y="77" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prefix</text>
<rect x="504" y="40" width="128" height="48" rx="6" fill="#f5f5f5"/>
<rect x="504" y="40" width="128" height="48" rx="6" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="568" y="62" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="middle">Tool</text>
<text x="568" y="77" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">external</text>
<text x="240" y="282" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TOOL LATENCY WINDOW</text>
<text x="240" y="300" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">Serving sees call 1 as finished.</text>
<text x="240" y="313" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">The GPU idles; the KV cache may be</text>
<text x="240" y="326" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">evicted, swapped or recomputed</text>
<text x="240" y="339" fill="#2d3142" font-size="10" font-family="'Geist', sans-serif">(InferCept's per-pause choice).</text>
<rect x="664" y="120" width="256" height="280" rx="6" fill="#f5f5f5"/>
<rect x="664" y="120" width="256" height="280" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="680" y="142" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">WHERE THE RESEARCH INTERVENES</text>
<text x="680" y="173" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">SGLang / RadixAttention</text>
<text x="680" y="186" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">prefix cache across calls</text>
<text x="680" y="215" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Continuum</text>
<text x="680" y="228" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">pin KV with a TTL sized to the</text>
<text x="680" y="240" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">predicted tool duration</text>
<text x="680" y="269" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Sutradhara, AsyncFC (futures)</text>
<text x="680" y="282" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">overlap the tool run with</text>
<text x="680" y="294" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">prefill or decoding</text>
<text x="680" y="323" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">LLMCompiler</text>
<text x="680" y="336" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">plan a DAG, run independent</text>
<text x="680" y="348" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">calls in parallel</text>
<text x="680" y="377" fill="#2d3142" font-size="11" font-family="'Geist', sans-serif" font-weight="600">Autellix</text>
<text x="680" y="390" fill="#4f5d75" font-size="9.5" font-family="'Geist', sans-serif">program-level scheduling</text>
<line x1="40" y1="528" x2="920" y2="528" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
<text x="40" y="544" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<line x1="40" y1="565" x2="64" y2="565" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rl-agent-serving-pause-arrow)"/>
<text x="72" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Call</text>
<line x1="128" y1="565" x2="152" y2="565" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#rl-agent-serving-pause-arrow)"/>
<text x="160" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Return</text>
<rect x="232" y="560" width="14" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="254" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Window where request-level serving loses information</text>
<rect x="532" y="560" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="554" y="568" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Research that intervenes</text>

      </svg>
