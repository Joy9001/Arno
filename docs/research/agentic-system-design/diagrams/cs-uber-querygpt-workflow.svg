<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-uber-querygpt-workflow-title cs-uber-querygpt-workflow-desc" id="cs-uber-querygpt-workflow-root">
        <title id="cs-uber-querygpt-workflow-title">Uber QueryGPT workflow of narrow agents</title>
        <desc id="cs-uber-querygpt-workflow-desc">Flowchart of a question passing through an intent agent, a table agent, a user confirmation of tables, a column-prune agent and SQL generation.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cs-uber-querygpt-workflow-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #cs-uber-querygpt-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cs-uber-querygpt-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #cs-uber-querygpt-workflow-root .diagram-container { overflow-x: visible; }</style>
          <marker id="cs-uber-querygpt-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="cs-uber-querygpt-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="cs-uber-querygpt-workflow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Arrows (drawn first, behind nodes) -->
