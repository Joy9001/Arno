<rect x="760" y="328" width="160" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="840" y="353.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Column-prune agent</text>
<text x="840" y="366.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strips columns</text>
<rect x="520" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="600" y="353.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate SQL</text>
<text x="600" y="366.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPT-4 Turbo · 128K</text>
<rect x="280" y="328" width="160" height="56" rx="20" fill="#f5f5f5"/>
<rect x="280" y="328" width="160" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="360" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQL query</text>
