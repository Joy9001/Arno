<text x="360" y="214.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">picks workspaces</text>
<rect x="520" y="176" width="160" height="56" rx="6" fill="#f5f5f5"/>
