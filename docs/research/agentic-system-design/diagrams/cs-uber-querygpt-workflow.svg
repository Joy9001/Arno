<text x="920" y="448" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Why prune: schemas of 200+ columns</text>
<text x="920" y="466" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">(40-60K tokens) blew the prototype's 32K window.</text>
