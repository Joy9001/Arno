<text x="360" y="98.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">12 curated + custom</text>
<rect x="40" y="176" width="152" height="56" rx="20" fill="#f5f5f5"/>
<rect x="40" y="176" width="152" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
