<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uber uReview code review prompt chain</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Uber uReview code review prompt chain</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-uber-ureview-prompt-chain-title cs-uber-ureview-prompt-chain-desc">
        <title id="cs-uber-ureview-prompt-chain-title">Uber uReview code review prompt chain</title>
        <desc id="cs-uber-ureview-prompt-chain-desc">Flowchart of a fixed review chain: generators, a grader prompt, semantic dedup and a category classifier fed by reviewer feedback, ending in inline comments.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Arrows (drawn first, behind nodes) -->
<path d="M208,140 H272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440,140 H504" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M672,140 H736" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M820,168 V256" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M736,284 H672" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M504,284 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
<path d="M588,312 V412 Q588,420 596,420 H736" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="640" y="400" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="666" y="409" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FEEDBACK</text>

<text x="124" y="144" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diff on Phabricator</text>
<rect x="272" y="112" width="168" height="56" rx="6" fill="#f5f5f5"/>
<rect x="272" y="112" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="356" y="137.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generators</text>
<text x="356" y="150.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Claude 4 Sonnet</text>
<rect x="504" y="112" width="168" height="56" rx="6" fill="#f5f5f5"/>
<rect x="504" y="112" width="168" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="588" y="137.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Grader prompt</text>
<text x="588" y="150.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">o4-mini-high · confidence</text>
<rect x="736" y="112" width="168" height="56" rx="6" fill="#f5f5f5"/>
<rect x="736" y="112" width="168" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="820" y="137.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Semantic dedup</text>
<text x="820" y="150.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">drops similar comments</text>
<rect x="736" y="256" width="168" height="56" rx="6" fill="#f5f5f5"/>

<text x="820" y="294.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">suppresses low-value types</text>
<rect x="504" y="256" width="168" height="56" rx="20" fill="#f5f5f5"/>
<rect x="504" y="256" width="168" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="588" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Inline comments</text>
<rect x="272" y="256" width="168" height="56" rx="6" fill="#f5f5f5"/>
<rect x="272" y="256" width="168" height="56" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="356" y="281.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fixer</text>
<text x="356" y="294.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proposes patches</text>
<rect x="736" y="392" width="168" height="56" rx="6" fill="#f5f5f5"/>
<rect x="736" y="392" width="168" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="820" y="417.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Feedback store</text>
<text x="820" y="430.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Useful / Not-Useful</text>
<!-- Callouts -->
<text x="272" y="72" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Pluggable assistants: bugs, internal best-practices, AppSec</text>
<path d="M356,80 V110" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="356" cy="112" r="2" fill="#2d3142"/>
<!-- Legend -->
<line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="120" y="548" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="152" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input / output</text>
<rect x="248" y="548" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Stage</text>

<text x="364" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>
<rect x="441" y="548" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="473" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Optional</text>
<rect x="540" y="548" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="572" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: grader, feedback to classifier</text>      </svg>
    </div>
  </div>
</body>
</html>
