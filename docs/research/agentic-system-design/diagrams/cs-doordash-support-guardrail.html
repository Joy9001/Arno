<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DoorDash Dasher support RAG with two-tier guardrail</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>DoorDash Dasher support RAG with two-tier guardrail</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-doordash-support-guardrail-title cs-doordash-support-guardrail-desc">
        <title id="cs-doordash-support-guardrail-title">DoorDash Dasher support RAG with two-tier guardrail</title>
        <desc id="cs-doordash-support-guardrail-desc">Flowchart of a support response that passes a cheap similarity check, escalates to an LLM groundedness check only when flagged, and defaults to a human agent on failure.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Arrows (drawn first, behind nodes) -->
<path d="M192,100 H264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M416,100 H488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="420" y="80" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="452" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CORE ISSUE</text>
<path d="M640,100 H712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="646" y="80" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="676" y="89" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RETRIEVED</text>
<path d="M788,128 V188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M684,244 H604" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="620" y="224" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="644" y="233" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FLAGGED</text>

<rect x="338" y="224" width="36" height="12" rx="2" fill="#f5f5f5"/>
<text x="356" y="233" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAILS</text>
<path d="M788,300 V388" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="796" y="340" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="818" y="349" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PASSES</text>
<path d="M500,300 V408 Q500,416 508,416 H712" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="584" y="396" width="52" height="12" rx="2" fill="#f5f5f5"/>
<text x="610" y="405" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">GROUNDED</text>
<!-- Nodes -->
<rect x="40" y="72" width="152" height="56" rx="20" fill="#f5f5f5"/>
<rect x="40" y="72" width="152" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="116" y="97.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Dasher chat</text>
<text x="116" y="110.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">multi-turn</text>
<rect x="264" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
<rect x="264" y="72" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="340" y="97.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Condense</text>
<text x="340" y="110.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">to one core issue</text>
<rect x="488" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
<rect x="488" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="564" y="97.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Resolved cases</text>
<text x="564" y="110.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">mapped to KB articles</text>
<rect x="712" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
<rect x="712" y="72" width="152" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="788" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate response</text>
<polygon points="788,188 892,244 788,300 684,244" fill="#f5f5f5"/>
<polygon points="788,188 892,244 788,300 684,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="788" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tier 1 check</text>
<text x="788" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">semantic similarity</text>
<text x="788" y="261" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cheap</text>
<polygon points="500,188 604,244 500,300 396,244" fill="#f5f5f5"/>
<polygon points="500,188 604,244 500,300 396,244" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="500" y="235" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tier 2 check</text>
<text x="500" y="248" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LLM groundedness</text>
<text x="500" y="261" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only if tier 1 flags</text>
<rect x="164" y="216" width="152" height="56" rx="6" fill="#f5f5f5"/>
<rect x="164" y="216" width="152" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="240" y="241.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human agent</text>
<text x="240" y="254.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">failure default</text>
<rect x="712" y="388" width="152" height="56" rx="20" fill="#f5f5f5"/>
<rect x="712" y="388" width="152" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="788" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shown to Dasher</text>
<!-- Callouts -->
<text x="40" y="344" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">All checks must pass before display;</text>
<text x="40" y="362" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">failure defaults to a human agent.</text>
<path d="M240,332 V274" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="240" cy="272" r="2" fill="#2d3142"/>
<!-- Legend -->
<line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="120" y="548" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="152" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input / output</text>
<rect x="248" y="548" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text>
<rect x="327" y="548" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="359" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>
<polygon points="436,554 448,548 460,554 448,560" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="468" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Check</text>
<rect x="520" y="548" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="552" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: second tier and fallback</text>      </svg>
    </div>
  </div>
</body>
</html>
