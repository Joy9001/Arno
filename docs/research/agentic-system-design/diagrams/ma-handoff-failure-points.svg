<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ma-handoff-failure-points-title ma-handoff-failure-points-desc" id="ma-handoff-failure-points-root">
        <title id="ma-handoff-failure-points-title">Where handoffs lose context</title>
        <desc id="ma-handoff-failure-points-desc">Architecture diagram of a worker handing results to a lead and the lead handing an answer to the user, with the two points where detail is dropped and the partial fixes.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ma-handoff-failure-points-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ma-handoff-failure-points-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ma-handoff-failure-points-root .diagram-container { width: 100%; overflow-x: auto; }
      #ma-handoff-failure-points-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ma-handoff-failure-points-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ma-handoff-failure-points-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ma-handoff-failure-points-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto-start-reverse"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

