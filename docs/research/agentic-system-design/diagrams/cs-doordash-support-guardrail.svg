<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-doordash-support-guardrail-title cs-doordash-support-guardrail-desc" id="cs-doordash-support-guardrail-root">
        <title id="cs-doordash-support-guardrail-title">DoorDash Dasher support RAG with two-tier guardrail</title>
        <desc id="cs-doordash-support-guardrail-desc">Flowchart of a support response that passes a cheap similarity check, escalates to an LLM groundedness check only when flagged, and defaults to a human agent on failure.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cs-doordash-support-guardrail-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #cs-doordash-support-guardrail-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cs-doordash-support-guardrail-root .diagram-container { width: 100%; overflow-x: auto; }
      #cs-doordash-support-guardrail-root .diagram-container { overflow-x: visible; }</style>
