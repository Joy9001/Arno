<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layered agent security · Layer stack</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Compensating security layers · Diagram Design</p>
    <h1>Layered agent security: construction over detection</h1>

    <div class="diagram-container">

        <title id="ops-layered-security-title">Layered agent security: construction over detection</title>
        <desc id="ops-layered-security-desc">Layer stack from untrusted content through probabilistic filters, a Rule of Two gate and a deterministic layer of patterns, gateway policy and least-privilege auth to the tools, showing what each layer cannot guarantee.</desc>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

<rect x="130" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="162" y="165" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BYPASSABLE</text>
<rect x="130" y="236" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="170" y="245" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">≤2 OF A, B, C</text>

xt><text x="616" y="137" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Useful, not a security boundary</text><rect x="56" y="176" width="848" height="52" rx="6" fill="#f5f5f5"/><rect x="56" y="176" width="848" height="52" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="480" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"></text><rect x="72" y="183" width="56" height="12" rx="2" fill="transparent" stroke="#bf4520" stroke-opacity="0.45" stroke-width="0.8"/><text x="100" y="192" fill="#bf4520" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L2 · GATE</text><text x="72" y="216" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Rule of Two check</text><text x="288" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Per session, at most two of:</text><text x="288" y="205" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">A untrusted input, B sensitive data or</text><text x="288" y="217" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">systems, C state change or external communication</text><text x="616" y="199" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">All three needed: human approval or</text><text x="616" y="211" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">another reliable check</text><rect x="56" y="256" width="848" height="172" rx="8" fill="#ececec" stroke="rgba(45,49,66,0.22)" stroke-width="1"/><text x="72" y="273" fill="#4f5d75" font-size="8" letter-spacing="0.12em" font-family="'Geist Mono', monospace" text-anchor="start">DETERMINISTIC LAYER · THE GUARANTEE COMES FROM WHAT THE AGENT CANNOT DO</text><line x1="64" y1="328" x2="896" ege auth</text><text x="288" y="397" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">Audience-bound OAuth tokens;</text><text x="288" y="409" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">short-lived, task-scoped credentials</text><rect x="56" y="456" width="848" height="36" rx="6" fill="#f5f5f5"/><rect x="56" y="456" width="848" height="36" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="480" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle"></text><text x="72" y="479" fill="#2d3142" font-size="12" font-family="'Geist', sans-serif" font-weight="600" text-anchor="start">Tools and external systems</text><text x="288" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">only permitted calls reach them</text><line x1="56" y1="516" x2="904" y2="516" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="56" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text><rect x="56" y="547" width="24" height="10" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/><text x="90" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Probabilistic filter</text><rect x="204" y="547" width="24" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/><text x="238" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate</text><rect x="300" y="547" width="24" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/><text x="334" y="555" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input</text><rect x="396" y="547" width="24" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><text x="430" y="555" fill="#4f
