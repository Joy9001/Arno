<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rm-hybrid-retrieval-pipeline-title rm-hybrid-retrieval-pipeline-desc" id="rm-hybrid-retrieval-pipeline-root">
        <title id="rm-hybrid-retrieval-pipeline-title">Hybrid retrieval pipeline: indexing time vs query time</title>
        <desc id="rm-hybrid-retrieval-pipeline-desc">Contextualized chunks are built once at indexing time and feed both a vector index and a BM25 index; at query time dense and BM25 search are fused, reranked and the top 20 chunks go into the prompt.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rm-hybrid-retrieval-pipeline-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #rm-hybrid-retrieval-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rm-hybrid-retrieval-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #rm-hybrid-retrieval-pipeline-root .diagram-container { overflow-x: visible; }</style>
