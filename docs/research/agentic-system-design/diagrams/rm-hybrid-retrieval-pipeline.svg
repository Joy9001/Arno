        <text x="56" y="57" fill="#5a6580" font-size="7" font-family="'Geist Mono', monospace" font-weight="500" letter-spacing="0.14em">INDEXING TIME · ONCE PER DOCUMENT, RE-RUN ON DOCUMENT CHANGE</text>
