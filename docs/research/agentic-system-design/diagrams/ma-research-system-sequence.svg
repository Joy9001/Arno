<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ma-research-system-sequence-title ma-research-system-sequence-desc" id="ma-research-system-sequence-root">
        <title id="ma-research-system-sequence-title">Anthropic research system: orchestrator, subagents, citation pass</title>
        <desc id="ma-research-system-sequence-desc">Sequence diagram of the Anthropic research system: the lead saves its plan, subagents read in parallel and return compact answers, a CitationAgent attributes claims and the lead delivers the final report.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ma-research-system-sequence-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ma-research-system-sequence-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ma-research-system-sequence-root .diagram-container { width: 100%; overflow-x: auto; }
      #ma-research-system-sequence-root .diagram-container { overflow-x: visible; }</style>
