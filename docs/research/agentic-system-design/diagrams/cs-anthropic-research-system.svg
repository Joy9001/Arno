<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-anthropic-research-system-title cs-anthropic-research-system-desc" id="cs-anthropic-research-system-root">
        <title id="cs-anthropic-research-system-title">Anthropic multi-agent Research system</title>
        <desc id="cs-anthropic-research-system-desc">Architecture diagram of a lead agent that saves its plan to external memory, spawns parallel subagents, receives lightweight references back via external storage, and passes its synthesis to a citation agent.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #cs-anthropic-research-system-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #cs-anthropic-research-system-root { font-family: var(--font-sans); color: var(--color-ink); }
      #cs-anthropic-research-system-root .diagram-container { width: 100%; overflow-x: auto; }
      #cs-anthropic-research-system-root .diagram-container { overflow-x: visible; }</style>
          <marker id="cs-anthropic-research-system-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="cs-anthropic-research-system-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="cs-anthropic-research-system-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Arrows (drawn first, behind nodes) -->
<path d="M152,252 H232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cs-anthropic-research-system-arrow)"/>
