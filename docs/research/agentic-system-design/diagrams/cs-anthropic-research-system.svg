<text x="96" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User query</text>
<rect x="232" y="224" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="232" y="224" width="176" height="56" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
<text x="320" y="249.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead agent</text>
<text x="320" y="262.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Opus 4 · plans, synthesizes</text>
<rect x="232" y="72" width="176" height="48" rx="6" fill="#f5f5f5"/>
<rect x="232" y="72" width="176" height="48" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
<text x="320" y="93.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External memory</text>
<text x="320" y="106.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">saved plan</text>
<rect x="496" y="224" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="496" y="224" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="584" y="249.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Subagents ×3-5</text>
<text x="584" y="262.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Sonnet 4 · own context</text>
<rect x="760" y="224" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="760" y="224" width="160" height="56" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
<text x="840" y="249.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External storage</text>
<text x="840" y="262.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">large outputs</text>
<rect x="232" y="376" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="232" y="376" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="401.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Citation agent</text>
<text x="320" y="414.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">attaches claims to sources</text>
<rect x="496" y="376" width="176" height="56" rx="20" fill="#f5f5f5"/>
<rect x="496" y="376" width="176" height="56" rx="20" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
<text x="584" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Answer with citations</text>
<!-- Callouts -->
<text x="440" y="100" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Context past 200K tokens is truncated,</text>
<text x="440" y="118" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">so the plan is saved first.</text>
<path d="M434,96 H412" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
<circle cx="408" cy="96" r="2" fill="#2d3142"/>
<text x="496" y="336" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Effort-scaling rules in the prompt bound spawning:</text>
<text x="496" y="354" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">1 agent for facts, 10+ subagents for complex work.</text>
<path d="M584,318 V284" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
<circle cx="584" cy="280" r="2" fill="#2d3142"/>
