<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anthropic multi-agent Research system</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Anthropic multi-agent Research system</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-anthropic-research-system-title cs-anthropic-research-system-desc">
        <title id="cs-anthropic-research-system-title">Anthropic multi-agent Research system</title>
        <desc id="cs-anthropic-research-system-desc">Architecture diagram of a lead agent that saves its plan to external memory, spawns parallel subagents, receives lightweight references back via external storage, and passes its synthesis to a citation agent.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Arrows (drawn first, behind nodes) -->
<path d="M152,252 H232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M292,224 V122" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="300" y="136" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="332" y="145" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SAVES PLAN</text>
<path d="M408,252 H496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="430" y="232" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="452" y="241" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SPAWNS</text>

<rect x="676" y="232" width="80" height="12" rx="2" fill="#f5f5f5"/>
<text x="716" y="241" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LARGE OUTPUTS</text>
<path d="M840,224 V172 Q840,164 832,164 H356 Q348,164 348,172 V222" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

<text x="594" y="153" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFERENCES</text>

<rect x="328" y="322" width="68" height="12" rx="2" fill="#f5f5f5"/>
<text x="362" y="331" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SYNTHESIZED</text>
<path d="M408,404 H496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Nodes -->
<rect x="40" y="224" width="112" height="56" rx="20" fill="#f5f5f5"/>
<rect x="40" y="224" width="112" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="96" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User query</text>
<rect x="232" y="224" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="232" y="224" width="176" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="320" y="249.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lead agent</text>
<text x="320" y="262.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Opus 4 · plans, synthesizes</text>
<rect x="232" y="72" width="176" height="48" rx="6" fill="#f5f5f5"/>
<rect x="232" y="72" width="176" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="320" y="93.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External memory</text>
<text x="320" y="106.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">saved plan</text>
<rect x="496" y="224" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="496" y="224" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="584" y="249.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Subagents ×3-5</text>
<text x="584" y="262.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Sonnet 4 · own context</text>
<rect x="760" y="224" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="760" y="224" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="840" y="249.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">External storage</text>
<text x="840" y="262.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">large outputs</text>
<rect x="232" y="376" width="176" height="56" rx="6" fill="#f5f5f5"/>
<rect x="232" y="376" width="176" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="320" y="401.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Citation agent</text>
<text x="320" y="414.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">attaches claims to sources</text>
<rect x="496" y="376" width="176" height="56" rx="20" fill="#f5f5f5"/>
<rect x="496" y="376" width="176" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="584" y="408" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Answer with citations</text>
<!-- Callouts -->
<text x="440" y="100" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Context past 200K tokens is truncated,</text>
<text x="440" y="118" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">so the plan is saved first.</text>
<path d="M434,96 H412" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="408" cy="96" r="2" fill="#2d3142"/>
<text x="496" y="336" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Effort-scaling rules in the prompt bound spawning:</text>
<text x="496" y="354" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">1 agent for facts, 10+ subagents for complex work.</text>
<path d="M584,318 V284" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="584" cy="280" r="2" fill="#2d3142"/>
<!-- Legend -->
<line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="120" y="548" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="152" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input / output</text>
<rect x="248" y="548" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Agent</text>
<rect x="332" y="548" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="364" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

<text x="473" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: lead agent and reference return</text>      </svg>
    </div>
  </div>
</body>
</html>
