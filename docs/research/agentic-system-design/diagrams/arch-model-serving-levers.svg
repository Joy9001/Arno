        <title id="arch-model-serving-levers-title">Self-hosted serving: where the levers act</title>
        <desc id="arch-model-serving-levers-desc">Inside the self-hosted pool a request flows from queue through prefill and the KV cache to decode, and each lever (continuous batching, PagedAttention and GQA, quantization, speculative decoding) acts on one stage.</desc>
