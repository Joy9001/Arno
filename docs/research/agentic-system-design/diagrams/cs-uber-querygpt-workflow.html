<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Uber QueryGPT workflow of narrow agents</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; min-width: 0; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Uber QueryGPT workflow of narrow agents</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cs-uber-querygpt-workflow-title cs-uber-querygpt-workflow-desc">
        <title id="cs-uber-querygpt-workflow-title">Uber QueryGPT workflow of narrow agents</title>
        <desc id="cs-uber-querygpt-workflow-desc">Flowchart of a question passing through an intent agent, a table agent, a user confirmation of tables, a column-prune agent and SQL generation.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Arrows (drawn first, behind nodes) -->
<path d="M360,112 V174" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="368" y="140" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="392" y="149" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NARROWS</text>
<path d="M192,204 H280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M440,204 H520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="448" y="184" width="64" height="12" rx="2" fill="#f5f5f5"/>
<text x="480" y="193" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WORKSPACES</text>
<path d="M680,204 H760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="698" y="184" width="44" height="12" rx="2" fill="#f5f5f5"/>
<text x="720" y="193" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TABLES</text>
<path d="M840,232 V326" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="848" y="274" width="60" height="12" rx="2" fill="#f5f5f5"/>
<text x="878" y="283" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRMED</text>
<path d="M760,356 H680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="696" y="336" width="48" height="12" rx="2" fill="#f5f5f5"/>
<text x="720" y="345" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCHEMAS</text>
<path d="M520,356 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<!-- Nodes -->
<rect x="280" y="64" width="160" height="48" rx="6" fill="#f5f5f5"/>
<rect x="280" y="64" width="160" height="48" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="360" y="85.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Workspaces</text>
<text x="360" y="98.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">12 curated + custom</text>
<rect x="40" y="176" width="152" height="56" rx="20" fill="#f5f5f5"/>
<rect x="40" y="176" width="152" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="116" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Question</text>
<rect x="280" y="176" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="280" y="176" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="360" y="201.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Intent agent</text>
<text x="360" y="214.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">picks workspaces</text>
<rect x="520" y="176" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="176" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="600" y="201.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Table agent</text>
<text x="600" y="214.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proposes tables</text>
<rect x="760" y="176" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="760" y="176" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="840" y="201.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User confirms</text>
<text x="840" y="214.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tables</text>
<rect x="760" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="760" y="328" width="160" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="840" y="353.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Column-prune agent</text>
<text x="840" y="366.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strips columns</text>
<rect x="520" y="328" width="160" height="56" rx="6" fill="#f5f5f5"/>
<rect x="520" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="600" y="353.5" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate SQL</text>
<text x="600" y="366.5" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">GPT-4 Turbo · 128K</text>
<rect x="280" y="328" width="160" height="56" rx="20" fill="#f5f5f5"/>
<rect x="280" y="328" width="160" height="56" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="360" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQL query</text>
<!-- Callouts -->
<text x="920" y="448" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">Why prune: schemas of 200+ columns</text>
<text x="920" y="466" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">(40-60K tokens) blew the prototype's 32K window.</text>
<path d="M840,432 V386" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
<circle cx="840" cy="384" r="2" fill="#2d3142"/>
<!-- Legend -->
<line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
<rect x="120" y="548" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="152" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Input / output</text>
<rect x="248" y="548" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="280" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Agent step</text>
<rect x="357" y="548" width="24" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="389" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>
<rect x="466" y="548" width="24" height="12" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
<text x="498" y="557" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal: confirm, then prune</text>      </svg>
    </div>
  </div>
</body>
</html>
