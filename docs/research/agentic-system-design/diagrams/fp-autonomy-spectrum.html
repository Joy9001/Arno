<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Who controls the next step: code or model?</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer stack · Diagram Design</p>
    <h1>Who controls the next step: code or model?</h1>

          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

        <text x="220" y="178" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">adds fixed steps</text>

        <rect x="152" y="222" width="48" height="12" rx="2" fill="transparent" stroke="#4f5d75" stroke-opacity="0.5" stroke-width="0.8"/>

        <text x="220" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Routing and parallelization</text>

        <rect x="140" y="408" width="560" height="72" fill="#ffffff"/>

        <rect x="140" y="48" width="560" height="432" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="140" y="336" width="560" height="72" fill="none" stroke="#bf4520" stroke-width="1"/>
        <line x1="132" y1="336" x2="708" y2="336" stroke="#2d3142" stroke-width="2"/>
        <line x1="716" y1="126" x2="716" y2="330" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <line x1="716" y1="342" x2="716" y2="474" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="732" y="154" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em" font-weight="500">WORKFLOW</text><text x="732" y="172" fill="#2d3142" font-size="10.5" font-family="'Geist', system-ui, sans-serif">LLMs and tools run through</text><text x="732" y="187" fill="#2d3142" font-size="10.5" font-family="'Geist', system-ui, sans-serif">predefined code paths:</text><text x="732" y="202" fill="#2d3142" font-size="10.5" font-family="'Geist', system-ui, sans-serif">code decides the next step.</text>

        <line x1="708" y1="84" x2="722" y2="84" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>

</html>
