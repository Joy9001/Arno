<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentic RAG: the model runs the retrieval loop</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Diagram Design</p>
    <h1>Agentic RAG: the model runs the retrieval loop</h1>

    <!-- Replace rm-agentic-rag-loop with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rm-agentic-rag-loop-title rm-agentic-rag-loop-desc">
        <title id="rm-agentic-rag-loop-title">Agentic RAG: the model runs the retrieval loop</title>
        <desc id="rm-agentic-rag-loop-desc">Flowchart of the agentic RAG loop: decide whether to retrieve, plan sub-queries, select a tool and retrieve, grade the evidence, then answer or loop back to re-plan.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/> -->

        <path d="M180,150 H230" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M370,150 H450" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M610,150 H690" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M790,182 V298" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M690,330 H600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M300,190 V298" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M530,370 V430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M530,290 V182" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <path d="M514,242 H526" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <circle cx="530" cy="242" r="2" fill="#2d3142"/>
        <rect x="396" y="128" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="410" y="137" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="272" y="238" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="282.0" y="247" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="540" y="230" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="578.0" y="239" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO · RE-PLAN</text>
        <rect x="540" y="394" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="554.0" y="403" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <text x="508" y="220" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the cost of re-planning:</text>
        <text x="508" y="236" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">unbounded cost and latency,</text>
        <text x="508" y="252" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">error compounding, harder to</text>
        <text x="508" y="268" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">evaluate, new attack surface</text>
        <rect x="40" y="118" width="140" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="40" y="118" width="140" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="110.0" y="146.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">User query</text>
        <text x="110.0" y="161.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ambiguous, multi-hop</text>
        <polygon points="300,110 370,150 300,190 230,150" fill="#f5f5f5"/>
        <polygon points="300,110 370,150 300,190 230,150" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="147.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieve</text>
        <text x="300" y="161.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">at all?</text>
        <rect x="450" y="118" width="160" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="450" y="118" width="160" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="530.0" y="140.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Plan</text>
        <text x="530.0" y="155.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">decompose query</text>
        <text x="530.0" y="167.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">into sub-queries</text>
        <rect x="690" y="118" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="690" y="118" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="790.0" y="146.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Select tool, retrieve</text>
        <text x="790.0" y="161.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vector · SQL · web · grep</text>
        <rect x="690" y="298" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="690" y="298" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="790.0" y="326.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Reflect: grade evidence</text>
        <text x="790.0" y="341.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">critic / grader scores it</text>
        <polygon points="530,290 600,330 530,370 460,330" fill="#f5f5f5"/>
        <polygon points="530,290 600,330 530,370 460,330" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="530" y="327.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Good</text>
        <text x="530" y="341.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">enough?</text>
        <rect x="220" y="298" width="160" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="220" y="298" width="160" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="300.0" y="326.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Answer directly</text>
        <text x="300.0" y="341.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parametric knowledge</text>
        <rect x="450" y="430" width="160" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="450" y="430" width="160" height="64" rx="20" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="530.0" y="458.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Generate answer</text>
        <text x="530.0" y="473.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">from retrieved evidence</text>
        <line x1="40" y1="540" x2="920" y2="540" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="566" width="24" height="12" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="72" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Start / end (oval)</text>
        <rect x="260" y="566" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="292" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step (rectangle)</text>
        <polygon points="460,572 472,566 484,572 472,578" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="492" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Decision (diamond)</text>
        <line x1="680" y1="572" x2="704" y2="572" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arrow-accent)"/>
        <text x="712" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Re-plan back-edge</text>


      </svg>
    </div>
  </div>
</body>
</html>
