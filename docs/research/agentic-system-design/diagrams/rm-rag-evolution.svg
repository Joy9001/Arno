<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rm-rag-evolution-title rm-rag-evolution-desc" id="rm-rag-evolution-root">
        <title id="rm-rag-evolution-title">RAG evolution: control moves from fixed code into the model</title>
        <desc id="rm-rag-evolution-desc">Four RAG paradigms in sequence, from a fixed naive pipeline to an agentic loop in which the model decides whether, what, where and how often to retrieve.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rm-rag-evolution-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #rm-rag-evolution-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rm-rag-evolution-root .diagram-container { width: 100%; overflow-x: auto; }
      #rm-rag-evolution-root .diagram-container { overflow-x: visible; }</style>
          <marker id="rm-rag-evolution-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="rm-rag-evolution-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="rm-rag-evolution-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

          <!-- OPTIONAL: dot-pattern background. Uncomment the <pattern> and the second <rect> below if you want the dotted paper look. -->
          <!--
          <pattern id="rm-rag-evolution-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          -->
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <!-- <rect width="100%" height="100%" fill="url(#rm-rag-evolution-dots)" opacity="0.55"/> -->

        <path d="M192,272 H288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rm-rag-evolution-arrow)"/>
        <path d="M432,272 H528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rm-rag-evolution-arrow)"/>
        <path d="M672,272 H768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rm-rag-evolution-arrow)"/>
        <path d="M876,216 V188 Q876,180 868,180 H812 Q804,180 804,188 V216" fill="none" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#rm-rag-evolution-arrow-accent)"/>
        <rect x="208" y="250" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="259" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">+ PRE/POST</text>
        <rect x="450" y="250" width="60" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="259" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">+ ROUTING</text>
        <rect x="680" y="250" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="720" y="259" fill="#5a6580" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MODEL DECIDES</text>
        <rect x="802" y="160" width="76" height="12" rx="2" fill="#f5f5f5"/>
        <text x="840" y="169" fill="#bf4520" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RE-PLAN LOOP</text>
        <path d="M48,344 V352 H672 V344" fill="none" stroke="#2d3142" stroke-width="1" stroke-opacity="0.40"/>
        <path d="M768,344 V352 H912 V344" fill="none" stroke="#2d3142" stroke-width="1" stroke-opacity="0.40"/>
        <text x="360" y="382" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">stages 1-3: fixed or configured code</text>
        <text x="360" y="398" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">that ends in one generate call</text>
        <text x="912" y="382" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">stage 4: the model decides whether,</text>
        <text x="912" y="398" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">what, where and how often to retrieve</text>
        <rect x="48" y="216" width="144" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="48" y="216" width="144" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="120.0" y="256.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Naive RAG</text>
        <text x="120.0" y="271.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fixed, 2020-23</text>
        <text x="120.0" y="283.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">embed, top-k, stuff,</text>
        <text x="120.0" y="295.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">generate</text>
        <rect x="288" y="216" width="144" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="216" width="144" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360.0" y="256.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advanced RAG</text>
        <text x="360.0" y="271.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fixed + extra stages</text>
        <text x="360.0" y="283.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rewrite/HyDE, hybrid,</text>
        <text x="360.0" y="295.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rerank, generate</text>
        <rect x="528" y="216" width="144" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="528" y="216" width="144" height="112" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="600.0" y="256.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Modular RAG</text>
        <text x="600.0" y="271.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">configurable modules</text>
        <text x="600.0" y="283.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">router, retriever per</text>
        <text x="600.0" y="295.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">source, fusion</text>
        <rect x="768" y="216" width="144" height="112" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="216" width="144" height="112" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="840.0" y="256.0" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agentic RAG</text>
        <text x="840.0" y="271.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">model-directed loop</text>
        <text x="840.0" y="283.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan, select tool,</text>
        <text x="840.0" y="295.0" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">retrieve, reflect</text>
        <line x1="40" y1="540" x2="920" y2="540" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="556" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>
        <rect x="40" y="566" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="72" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Fixed or configured code</text>
        <rect x="260" y="566" width="24" height="12" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="292" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Model-directed stage</text>
        <line x1="460" y1="572" x2="484" y2="572" stroke="#bf4520" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#rm-rag-evolution-arrow-accent)"/>
        <text x="492" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Re-plan / re-retrieve loop</text>
        <line x1="680" y1="572" x2="704" y2="572" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#rm-rag-evolution-arrow)"/>
        <text x="712" y="575" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Adds capability</text>


      </svg>
