<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ops-cost-latency-levers-title ops-cost-latency-levers-desc" id="ops-cost-latency-levers-root">
        <title id="ops-cost-latency-levers-title">Cost and latency levers on the agent request path</title>
        <desc id="ops-cost-latency-levers-desc">Flowchart of one agent request and its loop showing where semantic cache, input guardrail, budget gate, router, prompt cache and parallel tool calls act, with the loop returning to the budget gate.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ops-cost-latency-levers-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ops-cost-latency-levers-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ops-cost-latency-levers-root .diagram-container { width: 100%; overflow-x: auto; }
      #ops-cost-latency-levers-root .diagram-container { overflow-x: visible; }</style>
          <marker id="ops-cost-latency-levers-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="ops-cost-latency-levers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="ops-cost-latency-levers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f5f5f5"/>
<path d="M216 136 L264 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M440 136 L488 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M664 136 L712 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M352 174 L352 204 Q352 212 344 212 L136 212 Q128 212 128 220 L128 262" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M776 186 L776 208 Q776 216 768 216 L584 216 Q576 216 576 224 L576 250" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M824 186 L824 262" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M488 294 L440 294" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M264 294 L216 294" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M352 338 L352 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<path d="M440 444 L908 444 Q916 444 916 436 L916 144 Q916 136 908 136 L888 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/>
<rect x="448" y="116" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="464" y="125" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">MISS</text>
<rect x="228" y="192" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="201" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HIT</text>
<rect x="636" y="196" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="676" y="205" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">WITHIN BUDGET</text>
<rect x="832" y="218" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="850" y="227" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">LIMIT</text>
<rect x="224" y="274" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="240" y="283" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DONE</text>
<rect x="360" y="363" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="400" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOOL REQUESTS</text>
<rect x="650" y="424" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="678" y="433" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NEXT TURN</text><rect x="40" y="104" width="176" height="64" rx="32" fill="#f5f5f5"/><rect x="40" y="104" width="176" height="64" rx="32" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/><text x="128" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Incoming request</text><text x="128" y="148" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">or loop turn</text><rect x="264" y="98" width="176" height="76" rx="6" fill="#f5f5f5"/><rect x="264" y="98" width="176" height="76" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><text x="352" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Semantic cache</text><text x="352" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">looser threshold: more</text><text x="352" y="154" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hits, more wrong answers</text><rect x="488" y="86" width="176" height="100" rx="6" fill="#f5f5f5"/><rect x="488" y="86" width="176" height="100" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="576" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Input guardrail</text><text x="576" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">parallel: lower latency,</text><text x="576" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">but side effects may</text><text x="576" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">already have run</text><text x="576" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">blocking: no wasted side</text><text x="576" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">effects, adds latency</text><rect x="712" y="86" width="176" height="100" rx="6" fill="#f5f5f5"/><rect x="712" y="86" width="176" height="100" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="800" y="110" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Budget gate</text><text x="800" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">circuit breaker, checked</text><text x="800" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">BEFORE each model call:</text><text x="800" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tokens, dollars, steps,</text><text x="800" y="164" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">consecutive errors,</text><text x="800" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">elapsed time</text><rect x="40" y="262" width="176" height="64" rx="32" fill="#f5f5f5"/><rect x="40" y="262" width="176" height="64" rx="32" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="128" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Final answer</text><rect x="264" y="250" width="176" height="88" rx="6" fill="#f5f5f5"/><rect x="264" y="250" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="352" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Model call</text><text x="352" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">prompt cache, stable prefix:</text><text x="352" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">reads about 0.1x base input;</text><text x="352" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">a timestamp in an early</text><text x="352" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">block defeats it</text><rect x="488" y="250" width="176" height="88" rx="6" fill="#f5f5f5"/><rect x="488" y="250" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="576" y="274" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router or cascade</text><text x="576" y="292" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">cheap model first, strong</text><text x="576" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">model when needed</text><text x="576" y="316" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(RouteLLM, FrugalGPT)</text><rect x="712" y="262" width="176" height="64" rx="32" fill="#f5f5f5"/><rect x="712" y="262" width="176" height="64" rx="32" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="800" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Stop the loop</text><text x="800" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">e.g. hard cap of</text><text x="800" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">8 model calls</text><rect x="264" y="400" width="176" height="88" rx="6" fill="#f5f5f5"/><rect x="264" y="400" width="176" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="352" y="424" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Parallel tools</text><text x="352" y="442" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">independent tool calls</text><text x="352" y="454" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">in parallel; LLMCompiler:</text><text x="352" y="466" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">up to 3.7x latency speedup,</text><text x="352" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6.7x cost saving</text><text x="40" y="42" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Offline work (evals, backfills): Batch API,</text><text x="40" y="58" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">50% discount, most batches under 1 hour</text><path d="M 76 60 Q 80 84 128 104" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/><circle cx="128" cy="104" r="2" fill="#2d3142"/><text x="364" y="42" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Risk: a cache hit on a tool-calling</text><text x="364" y="58" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">turn can return a stale plan</text><path d="M 358 60 Q 354 80 352 98" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/><circle cx="352" cy="98" r="2" fill="#2d3142"/><line x1="56" y1="520" x2="904" y2="520" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/><text x="56" y="536" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text><rect x="56" y="551" width="24" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><text x="90" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Step</text><rect x="152" y="551" width="24" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/><text x="186" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Cache</text><rect x="248" y="551" width="24" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/><text x="282" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Gate before each call</text><rect x="420" y="551" width="24" height="10" rx="2" fill="#2d3142" stroke="#2d3142" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/><text x="454" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Exit</text><line x1="504" y1="556" x2="530" y2="556" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ops-cost-latency-levers-arrow)"/><text x="538" y="559" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Flow</text>
      </svg>
