<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ma-topologies-title ma-topologies-desc" id="ma-topologies-root">
        <title id="ma-topologies-title">Topologies with a lead: who holds control</title>
        <desc id="ma-topologies-desc">Three multi-agent topologies in which a lead holds control: a single agent with tools, an orchestrator with workers that keep their own scratchpads, and a hierarchy of supervisors.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #ma-topologies-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #ma-topologies-root { font-family: var(--font-sans); color: var(--color-ink); }
      #ma-topologies-root .diagram-container { width: 100%; overflow-x: auto; }
      #ma-topologies-root .diagram-container { overflow-x: visible; }</style>
