<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rm-contextual-retrieval-failure-title rm-contextual-retrieval-failure-desc" id="rm-contextual-retrieval-failure-root">
        <title id="rm-contextual-retrieval-failure-title">Contextual retrieval: top-20 failure rate by step</title>
        <desc id="rm-contextual-retrieval-failure-desc">Bar chart of top-20 retrieval failure rate falling from 5.7% for baseline embeddings to 1.9% after contextual embeddings, contextual BM25 and reranking, a 67% cumulative reduction.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #rm-contextual-retrieval-failure-root { --color-paper:   #f5f5f5;   
      --color-ink:     #2d3142;   
      --color-muted:   #4f5d75;   
      --color-accent:  #bf4520;   
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #rm-contextual-retrieval-failure-root { font-family: var(--font-sans); color: var(--color-ink); }
      #rm-contextual-retrieval-failure-root .diagram-container { width: 100%; overflow-x: auto; }
      #rm-contextual-retrieval-failure-root .diagram-container { overflow-x: visible; }</style>
          <marker id="rm-contextual-retrieval-failure-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
