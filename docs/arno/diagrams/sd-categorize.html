<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rules label most rows, and the model labels the rest</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Arno import, categorizing</p>
    <h1>Rules label most rows, and the model labels the rest</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-categorize-title sd-categorize-desc">
        <title id="sd-categorize-title">Rules label most rows, and the model labels the rest</title>
        <desc id="sd-categorize-desc">After you commit an import, rules and a refund match label every row they cover; the remaining payees go to the model in parallel chunks, high-confidence answers become labels and rules, and the rest stay uncategorized.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 200,96 H 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 460,96 H 700" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 360,136 V 232" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580,256 H 792 Q 800,256 800,248 V 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 580,312 H 752 Q 760,312 760,320 V 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="552" y="72" width="48" height="12" fill="#f5f5f5"/>
        <text x="576" y="81" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MATCHED</text>
        <rect x="368" y="176" width="48" height="12" fill="#f5f5f5"/>
        <text x="392" y="185" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO RULE</text>
        <rect x="648" y="232" width="36" height="12" fill="#f5f5f5"/>
        <text x="666" y="241" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HIGH</text>
        <rect x="648" y="288" width="28" height="12" fill="#f5f5f5"/>
        <text x="662" y="297" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOW</text>

        <!-- Nodes -->
        <rect x="40" y="68" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="68" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="56" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">You commit</text>
        <text x="56" y="109" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">on the review screen</text>
        <rect x="260" y="60" width="200" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="60" width="200" height="76" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="276" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Rules</text>
        <text x="276" y="101" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">yours, then the model's;</text>
        <text x="276" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">equals, contains, regex;</text>
        <text x="276" y="127" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a refund copies its purchase</text>
        <rect x="700" y="60" width="220" height="76" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="60" width="220" height="76" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="716" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Labels and rules</text>
        <text x="716" y="101" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one write group, one undo;</text>
        <text x="716" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">model rules for next month</text>
        <rect x="260" y="232" width="320" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="260" y="232" width="320" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="276" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Categorizer model call</text>
        <text x="276" y="273" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">payees no rule covers, in parallel</text>
        <text x="276" y="286" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">chunks of 35; one structured call</text>
        <text x="276" y="299" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">per chunk, high or low confidence</text>
        <rect x="700" y="372" width="220" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="700" y="372" width="220" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="716" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Uncategorized (n)</text>
        <text x="716" y="413" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the model's guess as a hint;</text>
        <text x="716" y="426" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">people grouped, asked once</text>

        <!-- Callout -->
        <text x="40" y="264" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Each high answer becomes a rule,</text>
        <text x="40" y="281" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">so next month asks only</text>
        <text x="40" y="298" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">about new payees.</text>

        <!-- Legend -->
        <line x1="40" y1="480" x2="920" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="508" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="498" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="144" y="507" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">you</text>
        <rect x="192" y="498" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="216" y="507" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the model decides</text>
        <rect x="372" y="498" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="507" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">code</text>
        <rect x="448" y="498" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="472" y="507" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">stored</text>
      </svg>
    </div>
  </div>
</body>
</html>
