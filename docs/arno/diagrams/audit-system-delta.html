<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Arno system topology · Architecture delta</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-rule: rgba(45,49,66,0.12);
      --color-accent: #bf4520;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); color: var(--color-ink); background: var(--color-paper); min-height: 100vh; padding: 3rem 2rem; display: flex; align-items: center; justify-content: center; }
    .frame { width: 100%; max-width: 1200px; min-width: 0; margin: 0 auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.75rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.75rem, 3vw + 1rem, 2rem); line-height: 1.1; font-weight: 400; letter-spacing: -0.02em; margin-bottom: 1.75rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1100px; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Architecture delta · Diagram Design</p>
    <h1>Arno topology, before and after simplification</h1>

    <div class="diagram-container" role="region" aria-label="Before, changes, and after Arno system topology" tabindex="0">

        <desc id="audit-system-delta-desc">Six containers, 21-capability defensive harness, subagent sidecars, and 47-table pgledger collapse into a clean two-container app using plain PydanticAI, Generative UI, and a 15-table Postgres schema.</desc>

          <marker id="audit-system-delta-arrow" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <text x="24" y="52" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">6 containers · 112.5k LOC</text>

        <text x="840" y="52" fill="#4f5d75" font-size="10" font-family="'Geist', sans-serif">2 containers · ~30.9k LOC</text>
