<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One thread keeps two records</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Arno system design, step 6</p>
    <h1>One thread keeps two records</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-thread-records-title sd-thread-records-desc">
        <title id="sd-thread-records-title">One thread keeps two records</title>
        <desc id="sd-thread-records-desc">The client sends a thread's ID and a new message. The server loads that thread's model history, refreshes the snapshot if it's stale, and runs the agent. When the run ends, all messages go back to the model history, which compaction may edit, and the new messages go to the messages table, which is never edited.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 184,180 H 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 444,180 H 516" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 590,136 V 108 Q 590,100 598,100 H 696" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 590,224 V 252 Q 590,260 598,260 H 696" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 808,48 V 32 Q 808,24 800,24 H 366 Q 358,24 358,32 V 136" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="196" y="158" width="64" height="12" fill="#f5f5f5"/>
        <text x="228" y="167" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEW MESSAGE</text>
        <rect x="600" y="80" width="88" height="12" fill="#f5f5f5"/>
        <text x="644" y="89" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ALL_MESSAGES()</text>
        <rect x="600" y="240" width="88" height="12" fill="#f5f5f5"/>
        <text x="644" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">THIS TURN</text>
        <rect x="548" y="32" width="56" height="12" fill="#f5f5f5"/>
        <text x="576" y="41" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEXT TURN</text>

        <!-- Client (input) -->
        <rect x="40" y="136" width="144" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="136" width="144" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="112" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client</text>
        <text x="112" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sends the thread's ID,</text>
        <text x="112" y="203" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">never its history</text>

        <!-- Load -->
        <rect x="272" y="136" width="172" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="272" y="136" width="172" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="358" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Load the thread</text>
        <text x="358" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">swap in a new snapshot</text>
        <text x="358" y="203" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">if it's stale</text>

        <!-- Run -->
        <rect x="516" y="136" width="148" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="516" y="136" width="148" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="590" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent run</text>
        <text x="590" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reminder, compaction,</text>
        <text x="590" y="203" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">output limits</text>

        <!-- model_history (focal store) -->
        <rect x="696" y="48" width="224" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="48" width="224" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="808" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">conversations.model_history</text>
        <text x="808" y="106" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">what the model gets;</text>
        <text x="808" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">compaction edits it</text>

        <!-- messages (store) -->
        <rect x="696" y="208" width="224" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="696" y="208" width="224" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="808" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">messages</text>
        <text x="808" y="266" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">what you saw; never edited;</text>
        <text x="808" y="279" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">search, export, citations</text>

        <!-- Legend -->
        <line x1="40" y1="340" x2="920" y2="340" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="358" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="144" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">client</text>
        <rect x="208" y="358" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">server step</text>
        <rect x="328" y="358" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="352" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the record that changes</text>
        <rect x="520" y="358" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="544" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the record that doesn't</text>
        <line x1="736" y1="363" x2="760" y2="363" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="768" y="367" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">read next turn</text>
      </svg>
    </div>
  </div>
</body>
</html>
