<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 632" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="engine-composition-title engine-composition-desc">
        <title id="engine-composition-title">One scenario matrix answers every question</title>
        <desc id="engine-composition-desc">Ledger history goes to the pattern engine, which labels every payment and hands streams to the scenario kernel. The kernel builds one integer matrix of scenarios by days. Statistics and the affordability search both read that matrix; the money kernel supplies EMI costs to affordability, which returns a verdict and minimal plans. The backtest replays past origins, scores the statistics, and feeds calibration back.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 200,92 H 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 528,92 H 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 764,144 V 216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 764,304 V 376" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 764,480 V 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 528,428 H 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 608,244 H 528" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 528,276 H 608" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 120,128 V 252 Q 120,260 128,260 H 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="208" y="72" width="48" height="12" fill="#f5f5f5"/>
        <text x="232" y="81" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PAYMENTS</text>
        <rect x="544" y="72" width="48" height="12" fill="#f5f5f5"/>
        <text x="568" y="81" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STREAMS</text>
        <rect x="772" y="172" width="44" height="12" fill="#f5f5f5"/>
        <text x="794" y="181" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">MATRIX</text>
        <rect x="772" y="332" width="72" height="12" fill="#f5f5f5"/>
        <text x="808" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHECKPOINTS</text>
        <rect x="540" y="408" width="56" height="12" fill="#f5f5f5"/>
        <text x="568" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EMI COST</text>
        <rect x="548" y="224" width="40" height="12" fill="#f5f5f5"/>
        <text x="568" y="233" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SCORE</text>
        <rect x="536" y="256" width="64" height="12" fill="#f5f5f5"/>
        <text x="568" y="265" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CALIBRATE</text>
        <rect x="148" y="240" width="84" height="12" fill="#f5f5f5"/>
        <text x="190" y="249" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PAST ORIGINS</text>

        <!-- Ledger history -->
        <rect x="40" y="56" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="56" width="160" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="56" y="84" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Ledger history</text>
        <text x="56" y="101" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">payments and receipts</text>

        <!-- Pattern engine -->
        <rect x="264" y="40" width="264" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="40" width="264" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Pattern engine</text>
        <text x="280" y="81" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">calendar rules scored by an exact</text>
        <text x="280" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">alignment likelihood; labels every</text>
        <text x="280" y="107" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">payment as a series or everyday spend</text>

        <!-- Scenario kernel (focal) -->
        <rect x="608" y="40" width="312" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="608" y="40" width="312" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="624" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Scenario kernel</text>
        <text x="624" y="81" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one integer matrix, scenarios by days:</text>
        <text x="624" y="94" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">exact schedules, detected series,</text>
        <text x="624" y="107" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">resampled whole days, card float</text>

        <!-- Backtest -->
        <rect x="264" y="216" width="264" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="216" width="264" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Backtest</text>
        <text x="280" y="257" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">weekly origins, proper scores,</text>
        <text x="280" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">baselines, intervals on every number</text>

        <!-- Statistics -->
        <rect x="608" y="216" width="312" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="608" y="216" width="312" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="624" y="240" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Statistics</text>
        <text x="624" y="257" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">band, floor probability and its interval,</text>
        <text x="624" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">first crossing date, shortfall depth</text>

        <!-- Money kernel -->
        <rect x="264" y="392" width="264" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="392" width="264" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Money kernel</text>
        <text x="280" y="433" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">bank conventions, rate inversion,</text>
        <text x="280" y="446" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">exact rounding</text>

        <!-- Affordability (focal) -->
        <rect x="608" y="376" width="312" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="608" y="376" width="312" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="624" y="400" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Affordability</text>
        <text x="624" y="417" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">per-scenario critical values and an order</text>
        <text x="624" y="430" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">statistic; minimal multi-lever plans;</text>
        <text x="624" y="443" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">each reported plan rerun to confirm</text>

        <!-- Verdict -->
        <rect x="664" y="520" width="200" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="664" y="520" width="200" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="764" y="544" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Verdict and minimal plans</text>

        <!-- Callout -->
        <text x="40" y="536" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">The curve, the floor probability, and every what-if read</text>
        <text x="40" y="553" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">the same simulated futures, so they cannot disagree.</text>

        <!-- Legend -->
        <line x1="40" y1="584" x2="920" y2="584" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="612" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="602" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="144" y="611" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">stored</text>
        <rect x="208" y="602" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="611" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">pure code</text>
        <rect x="312" y="602" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="336" y="611" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the two new cores</text>
        <line x1="464" y1="607" x2="488" y2="607" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="496" y="611" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">feeds back</text>
      </svg>
