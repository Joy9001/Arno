<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-ledger-model-title sd-ledger-model-desc" id="sd-ledger-model-root">
        <title id="sd-ledger-model-title">The ledger model</title>
        <desc id="sd-ledger-model-desc">Arno's ledger: each real money movement is a movements row owning one or more balanced movement_legs between accounts, with captures linking evidence and undo_log storing one snapshot per write group.</desc>
  <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sd-ledger-model-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-ledger-model-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-ledger-model-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-ledger-model-root .diagram-container { overflow-x: visible; }
}</style>
  </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Relationships (drawn before boxes) -->
        <!-- accounts -> movement_legs (from / to) -->
        <path d="M 280 104 H 640 V 224 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <!-- movements -> movement_legs (owns legs) -->
        <line x1="600" y1="263" x2="680" y2="263" stroke="#bf4520" stroke-width="1.4"/>
        <!-- movements -> captures -->
        <path d="M 360 263 H 320 V 412 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2"/>
        <!-- movements -> undo_log -->
        <line x1="480" y1="318" x2="480" y2="368" stroke="#4f5d75" stroke-width="1.2"/>
        <!-- movement_legs -> payees -->
        <line x1="800" y1="340" x2="800" y2="376" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- Cardinality and relationship labels -->
        <g fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">
          <text x="290" y="98">1</text>
          <text x="672" y="218" text-anchor="end">N</text>
          <text x="608" y="257">1</text>
          <text x="672" y="257" text-anchor="end">N</text>
          <text x="352" y="257" text-anchor="end">1</text>
          <text x="290" y="406">N</text>
          <text x="488" y="334">1</text>
          <text x="488" y="362">N</text>
          <text x="808" y="354">N</text>
          <text x="808" y="370">1</text>
        </g>
        <rect x="424" y="96" width="68" height="14" rx="2" fill="#f5f5f5"/>
        <text x="458" y="106" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FROM / TO</text>
        <rect x="610" y="271" width="60" height="14" rx="2" fill="#f5f5f5"/>
        <text x="640" y="281" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">BALANCED</text>

        <!-- accounts -->
        <rect x="40" y="48" width="240" height="124" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">accounts</text>
        <line x1="40" y1="76" x2="280" y2="76" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="52" y="92"># id  acc_…</text>
          <text x="52" y="106">kind  bank, card, loan, person…</text>
          <text x="52" y="120">name, institution, last4</text>
          <text x="52" y="134">card cycle, loan terms</text>
          <text x="52" y="148">statement_balance_paise</text>
          <text x="52" y="162">liquid, active</text>
        </g>

        <!-- movements (focal) -->
        <rect x="360" y="208" width="240" height="110" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="208" width="240" height="110" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="372" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">movements</text>
        <line x1="360" y1="236" x2="600" y2="236" stroke="#bf4520" stroke-width="1" stroke-opacity="0.25"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="372" y="252"># id  mov_…</text>
          <text x="372" y="266">date, description</text>
          <text x="372" y="280">kind  expense, split, loan…</text>
          <text x="372" y="294">one_off, category_hint</text>
          <text x="372" y="308">idempotency_key  retries</text>
        </g>

        <!-- movement_legs -->
        <rect x="680" y="200" width="240" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="692" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">movement_legs</text>
        <line x1="680" y1="228" x2="920" y2="228" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="692" y="244"># id, → movement_id</text>
          <text x="692" y="258">→ from_account_id, → to_account_id</text>
          <text x="692" y="272">amount_paise  &gt; 0, from &lt;&gt; to</text>
          <text x="692" y="286">→ category_id  editable</text>
          <text x="692" y="300">→ payee_id</text>
          <text x="692" y="314">expected_date  money owed</text>
          <text x="692" y="328">note</text>
        </g>

        <!-- captures -->
        <rect x="40" y="368" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">captures</text>
        <line x1="40" y1="396" x2="280" y2="396" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="52" y="412"># id, → movement_id</text>
          <text x="52" y="426">kind  chat, photo,</text>
          <text x="52" y="440">      statement_line</text>
          <text x="52" y="454">ref, upi_ref</text>
        </g>

        <!-- undo_log -->
        <rect x="360" y="368" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="372" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">undo_log</text>
        <line x1="360" y1="396" x2="600" y2="396" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="372" y="412"># id  und_…</text>
          <text x="372" y="426">actor, → message_id, summary</text>
          <text x="372" y="440">snapshot  [{before, after}]</text>
          <text x="372" y="454">created_at, undone_at</text>
        </g>

        <!-- payees -->
        <rect x="680" y="376" width="240" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="692" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">payees</text>
        <line x1="680" y1="404" x2="920" y2="404" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="692" y="420"># id, display_name</text>
          <text x="692" y="434">upi_id  ramesh@okaxis</text>
          <text x="692" y="448">match_hash  hashed identifiers</text>
          <text x="692" y="462">→ default_category_id</text>
          <text x="692" y="476">→ person_account_id</text>
        </g>

        <!-- Callout -->
        <text x="680" y="72" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Spending is legs into the</text>
        <text x="680" y="88" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Spending account, grouped by</text>
        <text x="680" y="104" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">their labels. Corrections edit</text>
        <text x="680" y="120" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">in place with undo snapshots.</text>

        <!-- Legend -->
        <line x1="40" y1="524" x2="920" y2="524" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="542" width="16" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="144" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one real money movement</text>
        <rect x="336" y="542" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Arno table</text>
        <text x="480" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"># key   → reference</text>
      </svg>
