<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-tool-surface-title sd-tool-surface-desc" id="sd-tool-surface-root">
        <title id="sd-tool-surface-title">Reads compute; every write is a direct call</title>
        <desc id="sd-tool-surface-desc">The model sees eight tools: three it calls directly to read (run_query, project, run_python) plus web search, and four write tools (record_movements, correct_movement, update_setup, undo), which land instantly or, for a wide scope, archiving, and settings, ask for a confirm tap first.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sd-tool-surface-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-tool-surface-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-tool-surface-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-tool-surface-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="sd-tool-surface-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sd-tool-surface-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="200" y="40" width="516" height="244" rx="8" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.45"/>
        <text x="212" y="56" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">READS · NO WRITES · 4 TOOLS</text>
        <rect x="364" y="300" width="352" height="172" rx="8" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.30"/>
        <text x="376" y="316" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">WRITES · ONE CARD EACH · 4 TOOLS</text>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 176,260 H 270 Q 278,260 278,252 V 196" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sd-tool-surface-arrow-accent)"/>
        <path d="M 340,150 H 352 Q 360,150 360,142 V 104 Q 360,96 368,96 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>
        <path d="M 340,166 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>
        <path d="M 340,182 H 352 Q 360,182 360,190 V 228 Q 360,236 368,236 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>

        <path d="M 176,292 H 344 Q 352,292 352,300 V 348 Q 352,356 360,356 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>
        <path d="M 176,316 H 324 Q 332,316 332,324 V 420 Q 332,428 340,428 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>

        <path d="M 700,96 H 736 Q 744,96 744,104 V 140 Q 744,148 752,148 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>
        <path d="M 700,166 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>
        <path d="M 700,356 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>
        <path d="M 700,428 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-tool-surface-arrow)"/>

        <!-- Arrow labels -->
        <rect x="212" y="240" width="52" height="12" fill="#f5f5f5"/>
        <text x="238" y="249" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DIRECT</text>

        <!-- Model (input) -->
        <rect x="40" y="240" width="136" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="240" width="136" height="120" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="108" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Model</text>
        <text x="108" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sees 8 tools:</text>
        <text x="108" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 reads, 4 writes,</text>
        <text x="108" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">and web search</text>

        <!-- Reads (focal) -->
        <rect x="216" y="136" width="124" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="136" width="124" height="60" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="278" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Reads</text>
        <text x="278" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">called directly</text>

        <!-- Read tools -->
        <rect x="380" y="68" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="68" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Ledger reads</text>
        <text x="396" y="103" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">run_query: read-only SQL,</text>
        <text x="396" y="115" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">2 s timeout, 1,000 rows, agent_ro</text>

        <rect x="380" y="138" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="138" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Tested engine</text>
        <text x="396" y="173" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">project: forecast and what-ifs;</text>
        <text x="396" y="185" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">verdicts come only from project</text>

        <rect x="380" y="208" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="208" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Scripts and search</text>
        <text x="396" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">run_python: isolated sandbox;</text>
        <text x="396" y="255" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">web_search: native, or Brave</text>

        <!-- Write tools -->
        <rect x="380" y="328" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="328" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Instant, with an undo card</text>
        <text x="396" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">record_movements, undo, update_setup,</text>
        <text x="396" y="378" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">correct_movement (this row)</text>

        <rect x="380" y="400" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="400" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Wide: asks for a confirm tap</text>
        <text x="396" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">correct_movement (future, all rows),</text>
        <text x="396" y="450" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">update_setup (archive, settings)</text>


        <!-- Ledger (store) -->
        <rect x="768" y="132" width="152" height="330" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="132" width="152" height="330" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="844" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ledger</text>
        <text x="844" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Postgres</text>
        <text x="844" y="315" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reads as agent_ro</text>
        <text x="844" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">writes audited</text>

        <!-- Legend -->
        <line x1="40" y1="564" x2="920" y2="564" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="582" width="16" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="144" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">model</text>
        <rect x="204" y="582" width="16" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="228" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">reads, never writes</text>
        <rect x="444" y="582" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="468" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">tools</text>
        <rect x="528" y="582" width="16" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="552" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">store</text>
      </svg>
