<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The agent loop runs for your chat and your schedules</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Arno system design, step 2</p>
    <h1>The agent loop runs for your chat and your schedules</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-agent-vs-workflow-title sd-agent-vs-workflow-desc">
        <title id="sd-agent-vs-workflow-title">The agent loop runs for your chat and your schedules</title>
        <desc id="sd-agent-vs-workflow-desc">Arno's paths by trigger: your chat and scheduled questions go to the agent loop; a statement upload goes to extraction, where the model may write a script, then to the review screen; a categorizer labels the rows after commit; and the minute loop's reminders and checks run as code that works when the LLM is down.</desc>

          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

<!-- Zones -->
        <rect x="280" y="40" width="328" height="200" rx="8" fill="none" stroke="rgba(191,69,32,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="292" y="58" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">MODEL DECIDES THE STEPS</text>
        <rect x="280" y="272" width="328" height="236" rx="8" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="292" y="288" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CODE DECIDES THE STEPS</text>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 208,106 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 208,247 H 240 Q 248,247 248,239 V 194 Q 248,186 256,186 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 208,448 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 592,106 H 672 Q 680,106 680,114 V 244 Q 680,252 688,252 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 592,196 H 652 Q 660,196 660,204 V 280 Q 660,288 668,288 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 444,220 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 592,344 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 592,448 H 804 Q 812,448 812,440 V 420" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="209" y="222" width="34" height="12" fill="#f5f5f5"/>
        <text x="226" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>
        <rect x="610" y="180" width="44" height="12" fill="#f5f5f5"/>
        <text x="632" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REVIEWED</text>
        <rect x="452" y="246" width="76" height="12" fill="#f5f5f5"/>
        <text x="490" y="255" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AFTER COMMIT</text>
        <rect x="612" y="324" width="40" height="12" fill="#f5f5f5"/>
        <text x="632" y="333" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LABELS</text>

        <!-- Nodes -->
        <rect x="40" y="72" width="168" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="168" height="68" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="124" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You</text>
        <text x="124" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chat, or your own schedules</text>
        <rect x="40" y="215" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="215" width="168" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="124" y="239" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Statement upload</text>
        <text x="124" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PDF, spreadsheet, text, photo</text>
        <rect x="40" y="416" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="416" width="168" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="124" y="440" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Minute loop</text>
        <text x="124" y="457" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reminders, nightly checks</text>
        <rect x="296" y="72" width="296" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="72" width="296" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="312" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Agent loop</text>
        <text x="312" y="113" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">chat, setup, your scheduled questions;</text>
        <text x="312" y="126" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">picks its tools; schedules run read-only</text>
        <rect x="524" y="82" width="56" height="14" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width="0.8"/>
        <text x="552" y="92" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LLM LOOP</text>
        <rect x="296" y="152" width="296" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="152" width="296" height="68" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="312" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Statement extraction</text>
        <text x="312" y="193" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one vision call, or a model run that</text>
        <text x="312" y="206" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">writes a script the host reruns</text>
        <rect x="524" y="162" width="56" height="14" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width="0.8"/>
        <text x="552" y="172" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LLM LOOP</text>
        <rect x="296" y="304" width="296" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="304" width="296" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Categorizer</text>
        <text x="312" y="345" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rules and refund match first, then one</text>
        <text x="312" y="358" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">model call per chunk of payees;</text>
        <text x="312" y="371" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">unsure rows stay uncategorized</text>
        <rect x="296" y="408" width="296" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="408" width="296" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Reminders, risk check, backup</text>
        <text x="312" y="449" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">engine computes every number; no</text>
        <text x="312" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">LLM call. The weekly briefing is a</text>
        <text x="312" y="475" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">scheduled question</text>
        <rect x="704" y="236" width="216" height="184" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="236" width="216" height="184" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="812" y="322" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ledger</text>
        <text x="812" y="338" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Postgres; every write audited</text>

        <!-- Callout -->
        <circle cx="280" cy="332" r="2" fill="#2d3142"/>
        <line x1="224" y1="332" x2="276" y2="332" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="40" y="316" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Code still runs with the</text>
        <text x="40" y="333" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">LLM down. Imports and</text>
        <text x="40" y="350" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">labels wait, like chat.</text>

        <!-- Legend -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

        <text x="144" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">trigger</text>
        <rect x="228" y="550" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>

        <text x="500" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">workflow: fixed steps in code</text>
        <rect x="724" y="550" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="748" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">store</text>

  </div>
</body>
</html>
