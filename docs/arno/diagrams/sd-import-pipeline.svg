<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-import-pipeline-title sd-import-pipeline-desc" id="sd-import-pipeline-root">
        <title id="sd-import-pipeline-title">A parser subagent imports each statement</title>
        <desc id="sd-import-pipeline-desc">The main agent hands an upload to a background parser subagent with no write tools. The subagent replays or repairs the saved parser and submits it to a code gate that reruns it, checks it, and replays it on stored statements; a failure goes back to the subagent, a pass goes to the review screen, and your commit saves the parser as a new version.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 120,96 V 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 200,220 H 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 280,264 H 200" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 600,236 H 680" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 760,192 V 160 Q 760,152 752,152 H 448 Q 440,152 440,160 V 176" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <path d="M 840,280 V 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 840,432 V 480" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 600,396 H 712 Q 720,396 720,388 V 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 440,360 V 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 740,500 H 448 Q 440,500 440,492 V 432" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="216" y="200" width="48" height="12" fill="#f5f5f5"/>
        <text x="240" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DELEGATE</text>
        <rect x="208" y="272" width="64" height="12" fill="#f5f5f5"/>
        <text x="240" y="281" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPORT, ASK</text>
        <rect x="616" y="212" width="48" height="12" fill="#f5f5f5"/>
        <text x="640" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SUBMIT</text>
        <rect x="572" y="128" width="56" height="12" fill="#f5f5f5"/>
        <text x="600" y="137" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL, WHY</text>
        <rect x="848" y="316" width="32" height="12" fill="#f5f5f5"/>
        <text x="864" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>
        <rect x="664" y="316" width="48" height="12" fill="#f5f5f5"/>
        <text x="688" y="325" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">REPLAY</text>
        <rect x="448" y="320" width="84" height="12" fill="#f5f5f5"/>
        <text x="490" y="329" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LATEST VERSION</text>
        <rect x="548" y="476" width="84" height="12" fill="#f5f5f5"/>
        <text x="590" y="485" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEW VERSION</text>

        <!-- You upload -->
        <rect x="40" y="40" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="40" width="160" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="56" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">You upload</text>
        <text x="56" y="80" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one or more files</text>

        <!-- Main agent -->
        <rect x="40" y="176" width="160" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="176" width="160" height="104" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="56" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Main agent</text>
        <text x="56" y="217" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">hands it off and</text>
        <text x="56" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">stays free; resumes,</text>
        <text x="56" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">answers, or asks you</text>

        <!-- Parser subagent (focal) -->
        <rect x="280" y="176" width="320" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="176" width="320" height="120" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="296" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Parser subagent, in the background</text>
        <text x="296" y="217" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">replays the bank's saved parser first;</text>
        <text x="296" y="230" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">else repairs it, or writes one, in Monty;</text>
        <text x="296" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">runs the checks as tools; keeps a plan;</text>
        <text x="296" y="256" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">no write or ledger tools</text>

        <!-- Gate -->
        <rect x="680" y="192" width="240" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="192" width="240" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="696" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Gate: submit_parser</text>
        <text x="696" y="233" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">fresh sandbox, then the checks;</text>
        <text x="696" y="246" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">replay on stored statements:</text>
        <text x="696" y="259" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rows must match the committed ones</text>

        <!-- Store -->
        <rect x="280" y="360" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="360" width="320" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="296" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Stored statements, parser versions</text>
        <text x="296" y="405" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">unlocked files kept; versions append-only</text>

        <!-- Review -->
        <rect x="760" y="360" width="160" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="360" width="160" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="776" y="388" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Review screen</text>
        <text x="776" y="405" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">dedupe, reconcile;</text>
        <text x="776" y="418" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">you approve</text>

        <!-- Commit -->
        <rect x="740" y="480" width="180" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="740" y="480" width="180" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="830" y="504" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Commit; save the version</text>

        <!-- Callout -->
        <text x="40" y="464" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">The gate is code. The subagent runs the same</text>
        <text x="40" y="481" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">checks while it works, but only the gate lets a</text>
        <text x="40" y="498" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">parser through, and only your commit saves it.</text>

        <!-- Legend -->
        <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="564" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="554" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="144" y="563" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">you</text>
        <rect x="192" y="554" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="216" y="563" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the model picks steps</text>
        <rect x="372" y="554" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="563" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">code</text>
        <rect x="448" y="554" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="472" y="563" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">stored</text>
        <line x1="536" y1="559" x2="560" y2="559" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="568" y="563" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">back to an agent</text>
      </svg>
