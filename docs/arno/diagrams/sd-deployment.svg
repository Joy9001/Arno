      #sd-deployment-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-deployment-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-deployment-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-deployment-root .diagram-container { overflow-x: visible; }
}</style>
