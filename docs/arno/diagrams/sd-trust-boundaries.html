<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outside text reaches the agent, but lasting writes need you</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Arno system design, step 7</p>
    <h1>Outside text reaches the agent, but lasting writes need you</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-trust-boundaries-title sd-trust-boundaries-desc">
        <title id="sd-trust-boundaries-title">Outside text reaches the agent, but lasting writes need you</title>
        <desc id="sd-trust-boundaries-desc">Strangers' text enters through a parse run or vision call that has no write or ledger tools, and lands in the ledger as typed rows. When the agent reads it back, the read sets a flag on the thread. Every write the agent asks for passes the write gate: everyday writes go through at once with undo, and lasting writes in a flagged thread wait for your tap. The agent and parse run send data to the LLM endpoints you chose, and no other route leads out of your instance.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Trust zones -->
        <rect x="24" y="60" width="168" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="74" y="64" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="108" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">STRANGERS</text>

        <rect x="24" y="220" width="168" height="128" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="52" y="224" width="112" height="12" rx="2" fill="#f5f5f5"/>
        <text x="108" y="233" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">PROVIDERS YOU CHOSE</text>

        <rect x="296" y="60" width="432" height="336" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="464" y="64" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="512" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR INSTANCE</text>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 176,116 H 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 464,132 H 552" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 312,148 H 244 Q 236,148 236,156 V 268 Q 236,276 228,276 H 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 312,308 H 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 604,172 V 196 Q 604,204 596,204 H 396 Q 388,204 388,212 V 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 464,292 H 552" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 660,252 V 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 800,292 H 712" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 868,332 V 356 Q 868,364 860,364 H 420 Q 412,364 412,356 V 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Blocked route: stops at the boundary -->
        <path d="M 348,332 V 396" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="336" y1="396" x2="360" y2="396" stroke="#2d3142" stroke-width="2.4"/>

        <!-- Arrow labels -->
        <rect x="212" y="94" width="64" height="12" fill="#f5f5f5"/>
        <text x="244" y="103" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OUTSIDE TEXT</text>
        <rect x="480" y="110" width="56" height="12" fill="#f5f5f5"/>
        <text x="508" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TYPED ROWS</text>
        <rect x="244" y="206" width="40" height="12" fill="#f5f5f5"/>
        <text x="264" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAMPLES</text>
        <rect x="216" y="286" width="56" height="12" fill="#f5f5f5"/>
        <text x="244" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVERY TURN</text>
        <rect x="456" y="182" width="80" height="12" fill="#f5f5f5"/>
        <text x="496" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">READ SETS FLAG</text>
        <rect x="488" y="270" width="40" height="12" fill="#f5f5f5"/>
        <text x="508" y="279" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">WRITE</text>
        <rect x="668" y="206" width="56" height="12" fill="#f5f5f5"/>
        <text x="696" y="215" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">IF ALLOWED</text>
        <rect x="736" y="270" width="56" height="12" fill="#f5f5f5"/>
        <text x="764" y="279" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YOUR TAP</text>
        <rect x="616" y="344" width="32" height="12" fill="#f5f5f5"/>
        <text x="632" y="353" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHAT</text>
        <rect x="356" y="372" width="64" height="12" fill="#f5f5f5"/>
        <text x="388" y="381" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO OUTBOUND</text>

        <!-- Strangers (external) -->
        <rect x="40" y="92" width="136" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="92" width="136" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <text x="108" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Strangers' text</text>
        <text x="108" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">UPI notes, payee names,</text>
        <text x="108" y="153" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">photos</text>

        <!-- LLM endpoints (external) -->
        <rect x="40" y="252" width="136" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="252" width="136" height="80" rx="6" fill="rgba(45,49,66,0.04)" stroke="#4f5d75" stroke-width="1"/>
        <text x="108" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">LLM endpoints</text>
        <text x="108" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chat, vision, speech;</text>
        <text x="108" y="313" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">local or cloud</text>

        <!-- Parse run, vision call -->
        <rect x="312" y="92" width="152" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="312" y="92" width="152" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="388" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Parse run, vision call</text>
        <text x="388" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no write or ledger tools;</text>
        <text x="388" y="153" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">typed fields out</text>

        <!-- Ledger (store) -->
        <rect x="552" y="92" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="552" y="92" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="632" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ledger, audit_log</text>
        <text x="632" y="140" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">every write audited;</text>
        <text x="632" y="153" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">outside fields stay marked</text>

        <!-- Agent run -->
        <rect x="312" y="252" width="152" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="312" y="252" width="152" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="388" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Agent run</text>
        <text x="388" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reads, runs scripts,</text>
        <text x="388" y="313" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">asks for writes</text>

        <!-- Write gate (focal) -->
        <rect x="552" y="252" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="552" y="252" width="160" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="632" y="276" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Write gate</text>
        <text x="632" y="293" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">everyday: instant, undo</text>
        <text x="632" y="306" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">lasting, in a flagged</text>
        <text x="632" y="319" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">thread: waits for a tap</text>

        <!-- You (input) -->
        <rect x="800" y="252" width="136" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="800" y="252" width="136" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="868" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You</text>
        <text x="868" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">your own words; the</text>
        <text x="868" y="313" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">only one who confirms</text>

        <!-- Blocked route caption, below the boundary -->
        <text x="336" y="415" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">no outbound tool; scripts reach nothing; links are plain text</text>

        <!-- Legend -->
        <line x1="24" y1="436" x2="936" y2="436" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="464" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="454" width="16" height="10" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <text x="124" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">trust boundary</text>
        <rect x="236" y="454" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="260" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">server step</text>
        <rect x="352" y="454" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="376" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">store or outside party</text>
        <rect x="512" y="454" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="536" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">enforced in code</text>
        <line x1="648" y1="459" x2="672" y2="459" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <line x1="672" y1="453" x2="672" y2="465" stroke="#2d3142" stroke-width="2.4"/>
        <text x="680" y="463" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a route that stops at the boundary</text>
      </svg>
    </div>
  </div>
</body>
</html>
