<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scripts read and compute; every write is a direct call</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Fin-Agent system design, step 5</p>
    <h1>Scripts read and compute; every write is a direct call</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-tool-surface-title sd-tool-surface-desc">
        <title id="sd-tool-surface-title">Scripts read and compute; every write is a direct call</title>
        <desc id="sd-tool-surface-desc">The model sees seven tools: run_code, which lets a script call eight read-only tools for ledger reads, tested maths and charts, and six write tools it calls directly, which land instantly, ask first in a flagged chat, or start an import that waits for your review.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="200" y="40" width="516" height="244" rx="8" fill="none" stroke="rgba(191,69,32,0.45)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="212" y="56" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">BEHIND RUN_CODE · READ-ONLY · 8 TOOLS</text>
        <rect x="364" y="300" width="352" height="244" rx="8" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="376" y="316" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">DIRECT CALLS · ONE CARD EACH · 6 TOOLS</text>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 176,260 H 270 Q 278,260 278,252 V 196" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 340,150 H 352 Q 360,150 360,142 V 104 Q 360,96 368,96 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 340,166 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 340,182 H 352 Q 360,182 360,190 V 228 Q 360,236 368,236 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 176,292 H 344 Q 352,292 352,300 V 348 Q 352,356 360,356 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 176,316 H 324 Q 332,316 332,324 V 420 Q 332,428 340,428 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 176,340 H 304 Q 312,340 312,348 V 492 Q 312,500 320,500 H 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 700,96 H 736 Q 744,96 744,104 V 140 Q 744,148 752,148 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 700,166 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 700,356 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 700,428 H 768" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 700,500 H 768" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="212" y="240" width="52" height="12" fill="#f5f5f5"/>
        <text x="238" y="249" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">A SCRIPT</text>
        <rect x="704" y="480" width="60" height="12" fill="#f5f5f5"/>
        <text x="734" y="489" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AFTER REVIEW</text>

        <!-- Model (input) -->
        <rect x="40" y="240" width="136" height="120" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="240" width="136" height="120" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="108" y="286" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Model</text>
        <text x="108" y="304" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">sees 7 tools:</text>
        <text x="108" y="317" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">run_code and</text>
        <text x="108" y="330" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the 6 writes</text>

        <!-- run_code (focal) -->
        <rect x="216" y="136" width="124" height="60" rx="6" fill="#f5f5f5"/>
        <rect x="216" y="136" width="124" height="60" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="278" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">run_code</text>
        <text x="278" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Python in Monty</text>

        <!-- Read tools -->
        <rect x="380" y="68" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="68" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="88" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Ledger reads</text>
        <text x="396" y="103" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">get_financial_context, query_movements,</text>
        <text x="396" y="115" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">summarize_spending, run_query</text>

        <rect x="380" y="138" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="138" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Tested maths</text>
        <text x="396" y="173" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">project, amortize, compound;</text>
        <text x="396" y="185" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">verdicts come only from project</text>

        <rect x="380" y="208" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="208" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Charts</text>
        <text x="396" y="243" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">show_chart: a typed spec;</text>
        <text x="396" y="255" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Fin-Agent emits the card itself</text>

        <!-- Write tools -->
        <rect x="380" y="328" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="328" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="350" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Instant, with an undo card</text>
        <text x="396" y="366" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">record_movement, correct_movement, undo</text>

        <rect x="380" y="400" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="400" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="422" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Lasting: asks first in a flagged chat</text>
        <text x="396" y="438" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">update_setup, preference</text>

        <rect x="380" y="472" width="320" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="380" y="472" width="320" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Starts an import</text>
        <text x="396" y="510" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">import_document; you approve the review</text>

        <!-- Ledger (store) -->
        <rect x="768" y="132" width="152" height="396" rx="6" fill="#f5f5f5"/>
        <rect x="768" y="132" width="152" height="396" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="844" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ledger</text>
        <text x="844" y="302" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Postgres</text>
        <text x="844" y="315" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reads as agent_ro</text>
        <text x="844" y="328" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">writes audited</text>

        <!-- Legend -->
        <line x1="40" y1="564" x2="920" y2="564" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="592" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="582" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="144" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">model</text>
        <rect x="204" y="582" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="228" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the one tool scripts go through</text>
        <rect x="444" y="582" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="468" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">tools</text>
        <rect x="528" y="582" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="552" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">store</text>
        <line x1="608" y1="587" x2="632" y2="587" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="640" y="591" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">waits for you</text>
      </svg>
    </div>
  </div>
</body>
</html>
