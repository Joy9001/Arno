<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-chat-turn-control-title sd-chat-turn-control-desc" id="sd-chat-turn-control-root">
        <title id="sd-chat-turn-control-title">Who decides what in one chat turn</title>
        <desc id="sd-chat-turn-control-desc">One chat turn across three lanes: you send a message, the model picks the tool and fills it in, code checks the rules and writes, and you confirm only a lasting write in a flagged conversation before the model replies with an undo card.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sd-chat-turn-control-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-chat-turn-control-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-chat-turn-control-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-chat-turn-control-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="sd-chat-turn-control-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sd-chat-turn-control-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Lanes -->
        <line x1="40" y1="56" x2="920" y2="56" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <line x1="40" y1="160" x2="920" y2="160" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <line x1="40" y1="264" x2="920" y2="264" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <line x1="40" y1="368" x2="920" y2="368" stroke="#2d3142" stroke-width="1" stroke-opacity="0.15"/>
        <text x="40" y="111" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">YOU</text>
        <text x="40" y="215" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">MODEL</text>
        <text x="40" y="319" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CODE</text>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 200,140 V 204 Q 200,212 208,212 H 288" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-chat-turn-control-arrow)"/>
        <path d="M 352,244 V 308 Q 352,316 360,316 H 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-chat-turn-control-arrow)"/>
        <path d="M 568,316 H 632" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-chat-turn-control-arrow)"/>
        <path d="M 488,284 V 140" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sd-chat-turn-control-arrow-accent)"/>
        <path d="M 568,108 H 672 Q 680,108 680,116 V 284" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-chat-turn-control-arrow)"/>
        <path d="M 760,316 H 840 Q 848,316 848,308 V 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-chat-turn-control-arrow)"/>
        <path d="M 848,180 V 140" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-chat-turn-control-arrow)"/>

        <!-- Arrow labels -->
        <rect x="576" y="296" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="305" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO CARD</text>
        <rect x="496" y="200" width="80" height="12" rx="2" fill="#f5f5f5"/>
        <text x="500" y="209" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">LASTING WRITE</text>
        <rect x="584" y="88" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="616" y="97" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONFIRMED</text>

        <!-- You: send -->
        <rect x="136" y="76" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="136" y="76" width="128" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="148" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">You send</text>
        <text x="148" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">"paid 450 on</text>
        <text x="148" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">swiggy"</text>

        <!-- Model: pick -->
        <rect x="288" y="180" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="288" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Picks the tool</text>
        <text x="300" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">fills the fields;</text>
        <text x="300" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">assumes your account</text>

        <!-- Code: checks -->
        <rect x="440" y="284" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="284" width="128" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="452" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Checks rules</text>
        <text x="452" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">category, duplicate,</text>
        <text x="452" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">card needed?</text>

        <!-- You: confirm (focal) -->
        <rect x="440" y="76" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="440" y="76" width="128" height="64" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="452" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Confirm card</text>
        <text x="452" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">lasting writes, in</text>
        <text x="452" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">flagged chats only</text>

        <!-- Code: write -->
        <rect x="632" y="284" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="632" y="284" width="128" height="64" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="644" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Writes</text>
        <text x="644" y="324" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">row + audit entry,</text>
        <text x="644" y="336" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one transaction</text>

        <!-- Model: reply -->
        <rect x="784" y="180" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="784" y="180" width="128" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="796" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Replies</text>
        <text x="796" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">phrases the answer</text>
        <text x="796" y="232" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">with the undo card</text>

        <!-- You: sees -->
        <rect x="784" y="76" width="128" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="784" y="76" width="128" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="796" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">You can undo</text>
        <text x="796" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a REST call;</text>
        <text x="796" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">no LLM involved</text>

        <!-- Callout -->
        <text x="136" y="396" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">The model owns judgment and language; code owns every rule that must hold every time.</text>

        <!-- Legend -->
        <line x1="40" y1="420" x2="920" y2="420" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="448" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="438" width="16" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="144" y="447" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">your action</text>
        <rect x="264" y="438" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="288" y="447" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">model judgment</text>
        <rect x="432" y="438" width="16" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="456" y="447" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">code rule</text>
        <rect x="568" y="438" width="16" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="592" y="447" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the one place you're asked first</text>
      </svg>
