<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-agent-vs-workflow-title sd-agent-vs-workflow-desc" id="sd-agent-vs-workflow-root">
        <title id="sd-agent-vs-workflow-title">Only chat runs an agent loop</title>
        <desc id="sd-agent-vs-workflow-desc">Fin-Agent's paths by trigger: your chat goes to the one agent loop, while scheduled jobs and statement imports run as code workflows with at most one LLM call each, and all of them work on the ledger.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sd-agent-vs-workflow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-agent-vs-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-agent-vs-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-agent-vs-workflow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="sd-agent-vs-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sd-agent-vs-workflow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="280" y="40" width="328" height="116" rx="8" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.45"/>
        <text x="292" y="58" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">MODEL DECIDES THE STEPS</text>
        <rect x="280" y="172" width="328" height="340" rx="8" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.30"/>
        <text x="292" y="188" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CODE DECIDES · AT MOST ONE LLM CALL</text>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 208,106 H 296" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sd-agent-vs-workflow-arrow-accent)"/>
        <path d="M 208,256 H 240 Q 248,256 248,248 V 236 Q 248,228 256,228 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 208,276 H 256 Q 264,276 264,284 V 296 Q 264,304 272,304 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 208,380 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 444,412 V 436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,106 H 672 Q 680,106 680,114 V 252 Q 680,260 688,260 H 704" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sd-agent-vs-workflow-arrow-accent)"/>
        <path d="M 592,228 H 656 Q 664,228 664,236 V 274 Q 664,282 672,282 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,304 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,380 H 624 Q 632,380 632,372 V 334 Q 632,326 640,326 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,468 H 640 Q 648,468 648,460 V 356 Q 648,348 656,348 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>

        <!-- Triggers (input) -->
        <rect x="40" y="72" width="168" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="168" height="68" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="124" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You, in chat</text>
        <text x="124" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">text and voice notes</text>

        <rect x="40" y="234" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="234" width="168" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="124" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scheduler</text>
        <text x="124" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">weekly, nightly, after writes</text>

        <rect x="40" y="348" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="348" width="168" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="124" y="376" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Statement upload</text>
        <text x="124" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PDF, CSV, XLS</text>

        <!-- Agent loop (focal) -->
        <rect x="296" y="72" width="296" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="72" width="296" height="68" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="312" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Agent loop</text>
        <text x="312" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">chat and setup; picks its own tools</text>
        <text x="312" y="127" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">reads via Code Mode, writes one row each</text>
        <rect x="524" y="82" width="56" height="14" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width="0.8"/>
        <text x="552" y="92" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LLM LOOP</text>

        <!-- Workflows (backend) -->
        <rect x="296" y="196" width="296" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="196" width="296" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="222" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Weekly briefing</text>
        <text x="312" y="238" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">engine computes every number;</text>
        <text x="312" y="251" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one LLM call writes the prose</text>
        <rect x="532" y="206" width="48" height="14" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="556" y="216" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">1 LLM</text>

        <rect x="296" y="272" width="296" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="272" width="296" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Reminders and warnings</text>
        <text x="312" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">dues, risk turns, subscriptions;</text>
        <text x="312" y="327" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">rules and templates only</text>
        <rect x="532" y="282" width="48" height="14" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="556" y="292" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO LLM</text>

        <rect x="296" y="348" width="296" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="348" width="296" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="374" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Statement extraction</text>
        <text x="312" y="390" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">bank parser, or one tool-less LLM call;</text>
        <text x="312" y="403" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a balance check gates every import</text>
        <rect x="532" y="358" width="48" height="14" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="556" y="368" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">≤1 LLM</text>

        <rect x="296" y="436" width="296" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="436" width="296" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="462" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Merchant categorizer</text>
        <text x="312" y="478" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">answer must be a listed category;</text>
        <text x="312" y="491" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">saved as a rule, so it runs once</text>
        <rect x="532" y="446" width="48" height="14" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="556" y="456" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">1 LLM</text>

        <!-- Ledger (store) -->
        <rect x="704" y="236" width="216" height="136" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="236" width="216" height="136" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="812" y="298" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ledger</text>
        <text x="812" y="314" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Postgres; every write audited</text>

        <!-- Callout -->
        <circle cx="280" cy="464" r="2" fill="#2d3142"/>
        <line x1="224" y1="464" x2="276" y2="464" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <text x="40" y="448" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Each workflow still runs with</text>
        <text x="40" y="464" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">the LLM down: a template</text>
        <text x="40" y="480" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">replaces the prose.</text>

        <!-- Legend -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="550" width="16" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="144" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">trigger</text>
        <rect x="228" y="550" width="16" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="252" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">agent: the model picks steps</text>
        <rect x="476" y="550" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">workflow: fixed steps in code</text>
        <rect x="724" y="550" width="16" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="748" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">store</text>
      </svg>
