<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-agent-vs-workflow-title sd-agent-vs-workflow-desc" id="sd-agent-vs-workflow-root">
        <title id="sd-agent-vs-workflow-title">The agent loop runs for you and for new layouts</title>
        <desc id="sd-agent-vs-workflow-desc">Fin-Agent's paths by trigger: your chat and the questions you schedule go to the agent loop, a new statement layout starts a parse run with no write tools, and known layouts, the categorizer and built-in jobs run as code that still works when the LLM is down.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sd-agent-vs-workflow-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-agent-vs-workflow-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-agent-vs-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-agent-vs-workflow-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="sd-agent-vs-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zones -->
        <rect x="280" y="40" width="328" height="196" rx="8" fill="none" stroke="#bf4520" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.45"/>
        <text x="292" y="58" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">MODEL DECIDES THE STEPS</text>
        <rect x="280" y="252" width="328" height="264" rx="8" fill="none" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.30"/>
        <text x="292" y="268" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">CODE DECIDES · AT MOST ONE LLM CALL</text>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 208,106 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 208,231 H 240 Q 248,231 248,223 V 194 Q 248,186 256,186 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 208,263 H 240 Q 248,263 248,271 V 300 Q 248,308 256,308 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 208,472 H 296" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 560,220 V 276" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 444,340 V 364" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,106 H 672 Q 680,106 680,114 V 244 Q 680,252 688,252 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,308 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,396 H 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>
        <path d="M 592,472 H 804 Q 812,472 812,464 V 440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-agent-vs-workflow-arrow)"/>

        <!-- Arrow labels -->
        <rect x="178" y="194" width="60" height="12" fill="#f5f5f5"/>
        <text x="208" y="203" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEW LAYOUT</text>
        <rect x="200" y="284" width="38" height="12" fill="#f5f5f5"/>
        <text x="219" y="293" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">KNOWN</text>
        <rect x="444" y="238" width="104" height="12" fill="#f5f5f5"/>
        <text x="496" y="247" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SAVED AFTER REVIEW</text>
        <rect x="620" y="286" width="72" height="12" fill="#f5f5f5"/>
        <text x="656" y="295" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">AFTER REVIEW</text>

        <!-- Triggers (input) -->
        <rect x="40" y="72" width="168" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="72" width="168" height="68" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="124" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">You</text>
        <text x="124" y="118" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">chat, or your own schedules</text>

        <rect x="40" y="215" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="215" width="168" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="124" y="243" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Statement upload</text>
        <text x="124" y="259" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">PDF, spreadsheet, text</text>

        <rect x="40" y="440" width="168" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="440" width="168" height="64" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="124" y="468" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Scheduler</text>
        <text x="124" y="484" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">weekly, nightly, after writes</text>

        <!-- Agent runs (focal) -->
        <rect x="296" y="72" width="296" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="72" width="296" height="68" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="312" y="98" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Agent loop</text>
        <text x="312" y="114" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">chat, setup, your scheduled questions;</text>
        <text x="312" y="127" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">picks its tools; schedules run read-only</text>
        <rect x="524" y="82" width="56" height="14" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width="0.8"/>
        <text x="552" y="92" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LLM LOOP</text>

        <rect x="296" y="152" width="296" height="68" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="152" width="296" height="68" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="312" y="178" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Parse run</text>
        <text x="312" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the same agent, no write tools;</text>
        <text x="312" y="207" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">writes a parser for the new layout</text>
        <rect x="524" y="162" width="56" height="14" rx="2" fill="#f5f5f5" stroke="#bf4520" stroke-width="0.8"/>
        <text x="552" y="172" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LLM LOOP</text>

        <!-- Workflows (backend) -->
        <rect x="296" y="276" width="296" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="276" width="296" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="302" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Saved parser</text>
        <text x="312" y="318" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a known layout reruns in Monty;</text>
        <text x="312" y="331" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">checks gate every import</text>
        <rect x="532" y="286" width="48" height="14" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="556" y="296" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO LLM</text>

        <rect x="296" y="364" width="296" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="364" width="296" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="390" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Merchant categorizer</text>
        <text x="312" y="406" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">answer must be a listed category;</text>
        <text x="312" y="419" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">saved as a rule, so it runs once</text>
        <rect x="532" y="374" width="48" height="14" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="556" y="384" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">1 LLM</text>

        <rect x="296" y="440" width="296" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="296" y="440" width="296" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="312" y="466" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Briefing, reminders, warnings</text>
        <text x="312" y="482" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">engine computes every number; at most</text>
        <text x="312" y="495" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one LLM call, for the briefing's prose</text>

        <!-- Ledger (store) -->
        <rect x="704" y="236" width="216" height="204" rx="6" fill="#f5f5f5"/>
        <rect x="704" y="236" width="216" height="204" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="812" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Ledger</text>
        <text x="812" y="360" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Postgres; every write audited</text>

        <!-- Callout -->
        <circle cx="280" cy="372" r="2" fill="#2d3142"/>
        <line x1="224" y1="372" x2="276" y2="372" stroke="#2d3142" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.40"/>
        <text x="40" y="356" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Code still runs with the LLM</text>
        <text x="40" y="372" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">down; only a new layout has</text>
        <text x="40" y="388" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">to wait for it.</text>

        <!-- Legend -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="550" width="16" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="144" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">trigger</text>
        <rect x="228" y="550" width="16" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="252" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">agent: the model picks steps</text>
        <rect x="476" y="550" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">workflow: fixed steps in code</text>
        <rect x="724" y="550" width="16" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="748" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">store</text>
      </svg>
