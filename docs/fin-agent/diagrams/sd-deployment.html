<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One way in, and only two ways out</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Fin-Agent system design, step 10</p>
    <h1>One way in, and only two ways out</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 516" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-deployment-title sd-deployment-desc">
        <title id="sd-deployment-title">One way in, and only two ways out</title>
        <desc id="sd-deployment-desc">Your phone or laptop reaches the machine over the tailnet, through tailscale serve on the host, which proxies to the API container on loopback. The API serves the web files and runs the agent and job loop. It talks to Postgres and, if it is on, sends spans to Phoenix on loopback, which keeps its own database. The backup sidecar dumps the app database and ships it off-site with restic. The API calls the LLM endpoints you chose. Those are the only two routes out.</desc>

          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <rect x="54" y="64" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="104" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR TAILNET</text>
        <rect x="224" y="60" width="480" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="414" y="64" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="464" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">YOUR MACHINE</text>
        <rect x="744" y="60" width="192" height="392" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <rect x="808" y="64" width="65" height="12" rx="2" fill="#f5f5f5"/>
        <text x="840" y="73" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">OUTSIDE</text>

        <path d="M 168,132 H 240" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 392,132 H 480" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <path d="M 584,300 V 348" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 688,388 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="185" y="110" width="38" height="12" fill="#f5f5f5"/>
        <text x="204" y="119" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="408" y="110" width="56" height="12" fill="#f5f5f5"/>
        <text x="436" y="119" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOOPBACK</text>
        <rect x="705" y="110" width="38" height="12" fill="#f5f5f5"/>
        <text x="724" y="119" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>
        <rect x="603" y="190" width="26" height="12" fill="#f5f5f5"/>
        <text x="616" y="199" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>
        <rect x="449" y="204" width="38" height="12" fill="#f5f5f5"/>

        <rect x="591" y="318" width="74" height="12" fill="#f5f5f5"/>
        <text x="628" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">APP DB ONLY</text>
        <rect x="702" y="366" width="44" height="12" fill="#f5f5f5"/>
        <text x="724" y="375" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESTIC</text>

        <rect x="40" y="92" width="128" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="92" width="128" height="80" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="104" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Phone or laptop</text>
        <text x="104" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the web app,</text>
        <text x="104" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">with a passkey</text>
        <rect x="240" y="92" width="152" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="92" width="152" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="316" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">tailscale serve</text>
        <text x="316" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on the host; HTTPS</text>
        <text x="316" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on the ts.net name</text>
        <rect x="480" y="92" width="208" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="92" width="208" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="584" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">api container</text>
        <text x="584" y="142" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">web files, API, agent, job loop;</text>
        <text x="584" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">published on 127.0.0.1 only</text>
        <rect x="240" y="220" width="152" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="220" width="152" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="316" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Phoenix</text>
        <text x="316" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">optional profile;</text>
        <text x="316" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">loopback only</text>
        <rect x="480" y="220" width="208" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="220" width="208" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="584" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Postgres</text>
        <text x="584" y="270" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the app database, and</text>
        <text x="584" y="283" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Phoenix's own database</text>
        <rect x="480" y="348" width="208" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="480" y="348" width="208" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="584" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">backup sidecar</text>
        <text x="584" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">pg_dump, then restic,</text>
        <text x="584" y="411" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">when over 24 hours old</text>
        <rect x="760" y="92" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="92" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>

        <text x="840" y="155" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">local ones stay inside</text>
        <rect x="760" y="348" width="160" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="348" width="160" height="80" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="840" y="386" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Off-site store</text>
        <text x="840" y="404" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">encrypted backups only</text>

        <line x1="24" y1="468" x2="936" y2="468" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="24" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="100" y="486" width="16" height="10" rx="2" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="0.8" stroke-dasharray="4,3"/>
        <text x="124" y="495" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">network boundary</text>
        <rect x="256" y="486" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="280" y="495" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a process</text>
        <rect x="360" y="486" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="384" y="495" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">store or endpoint</text>
        <line x1="512" y1="491" x2="536" y2="491" stroke="#bf4520" stroke-width="1.4"/>
        <text x="544" y="495" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the only way in</text>
        <line x1="656" y1="491" x2="680" y2="491" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="688" y="495" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">only with the traces profile</text>
      </svg>
    </div>
  </div>
</body>
</html>
