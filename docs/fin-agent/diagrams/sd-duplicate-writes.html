<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A chat write can't land twice</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Fin-Agent system design, step 2</p>
    <h1>A chat write can't land twice</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-duplicate-writes-title sd-duplicate-writes-desc">
        <title id="sd-duplicate-writes-title">A chat write can't land twice</title>
        <desc id="sd-duplicate-writes-desc">Before a chat write lands, a retried tool call returns the row already written, and a near-identical entry from minutes ago makes the agent ask first; otherwise the row and its audit entry commit together with an undo card.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 292,92 V 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472,160 H 568" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 292,196 V 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472,264 H 568" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 292,300 V 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="506" y="140" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="149" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="300" y="204" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="305" y="213" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">NO</text>
        <rect x="506" y="244" width="28" height="12" rx="2" fill="#f5f5f5"/>
        <text x="520" y="253" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="300" y="308" width="20" height="12" rx="2" fill="#f5f5f5"/>
        <text x="305" y="317" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">NO</text>

        <!-- Start -->
        <rect x="112" y="36" width="360" height="56" rx="20" fill="#f5f5f5"/>
        <rect x="112" y="36" width="360" height="56" rx="20" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="292" y="61" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">A write tool is called</text>
        <text x="292" y="77" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">"paid 450 for coffee"</text>

        <!-- Decision 1: transport retry -->
        <rect x="112" y="124" width="360" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="112" y="124" width="360" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <polygon points="126,128 132,134 126,140 120,134" fill="none" stroke="#2d3142" stroke-width="1"/>
        <text x="292" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">This exact call already committed?</text>
        <text x="292" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">a retry after a dropped connection;</text>
        <text x="292" y="181" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">keyed by message + tool call</text>

        <!-- Outcome 1 -->
        <rect x="568" y="124" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="124" width="320" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="728" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Return the row already written</text>
        <text x="728" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">nothing new lands</text>

        <!-- Decision 2: suspected duplicate (focal) -->
        <rect x="112" y="228" width="360" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="112" y="228" width="360" height="72" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <polygon points="126,232 132,238 126,244 120,238" fill="none" stroke="#bf4520" stroke-width="1"/>
        <text x="292" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Same amount and payee, minutes ago?</text>
        <text x="292" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">you retyped it after a timeout,</text>
        <text x="292" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">or really bought a second coffee</text>

        <!-- Outcome 2 -->
        <rect x="568" y="228" width="320" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="568" y="228" width="320" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="728" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The agent asks, in words</text>
        <text x="728" y="272" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">writes only if you say it's a new one;</text>
        <text x="728" y="285" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">no confirm card</text>

        <!-- Write -->
        <rect x="112" y="332" width="360" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="112" y="332" width="360" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="292" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Write the row and its audit entry</text>
        <text x="292" y="376" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one short DB transaction, then the undo card</text>

        <!-- Callout -->
        <circle cx="472" cy="364" r="2" fill="#2d3142"/>
        <line x1="476" y1="364" x2="560" y2="364" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="568" y="352" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Days later, a statement import merges this</text>
        <text x="568" y="368" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">row with its bank line: a third, separate</text>
        <text x="568" y="384" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">layer (import reconciliation).</text>

        <!-- Legend -->
        <line x1="40" y1="452" x2="920" y2="452" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="480" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="470" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/><polygon points="128,471 132,475 128,479 124,475" fill="none" stroke="#2d3142" stroke-width="0.8"/>
        <text x="144" y="479" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">check in code</text>
        <rect x="288" y="470" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="312" y="479" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">nothing written yet</text>
        <rect x="476" y="470" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="500" y="479" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the write</text>
        <rect x="620" y="470" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="644" y="479" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">new check from the review</text>
      </svg>
    </div>
  </div>
</body>
</html>
