<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The agent loop and its guards</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Fin-Agent system design, step 3</p>
    <h1>The agent loop and its guards</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-agent-loop-title sd-agent-loop-desc">
        <title id="sd-agent-loop-title">The agent loop and its guards</title>
        <desc id="sd-agent-loop-desc">The one agent loops between the model and its tools until it gives a final answer; compaction and tool output limits keep the context small, a backup model covers errors, and circuit breakers stop a runaway turn and hand back a partial answer.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows and guard lines (drawn before boxes) -->
        <path d="M 192,208 H 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 464,192 H 600" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 600,224 H 464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 364,248 V 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 600,352 H 464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 364,112 V 168" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <path d="M 700,112 V 168" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <path d="M 700,248 V 320" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <path d="M 192,80 H 216 Q 224,80 224,88 V 176 Q 224,184 232,184 H 264" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>

        <!-- Arrow labels -->
        <rect x="496" y="172" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="532" y="181" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">TOOL CALL</text>
        <rect x="508" y="232" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="532" y="241" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">RESULT</text>
        <rect x="372" y="278" width="36" height="12" rx="2" fill="#f5f5f5"/>
        <text x="377" y="287" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.06em">DONE</text>
        <rect x="488" y="332" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="532" y="341" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PARTIAL + WHY</text>

        <!-- You -->
        <rect x="40" y="176" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="176" width="152" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="116" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Your message</text>
        <text x="116" y="220" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">or a scheduled question</text>

        <!-- Backup model (guard) -->
        <rect x="40" y="48" width="152" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="48" width="152" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="116" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Backup model</text>
        <text x="116" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">takes over on errors</text>

        <!-- Compaction (guard) -->
        <rect x="264" y="48" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="48" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="364" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Compaction</text>
        <text x="364" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">keeps history inside the window</text>

        <!-- Tool output limits (guard) -->
        <rect x="600" y="48" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="48" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="700" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tool output limits</text>
        <text x="700" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">big returns spilled or trimmed</text>

        <!-- Model (focal) -->
        <rect x="264" y="168" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="168" width="200" height="80" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="364" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The model</text>
        <text x="364" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one agent, a pinned</text>
        <text x="364" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">frontier model</text>

        <!-- Tools -->
        <rect x="600" y="168" width="200" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="168" width="200" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="700" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Tools and Code Mode</text>
        <text x="700" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">reads, scripts, writes;</text>
        <text x="700" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">verdicts from the engine</text>

        <!-- Final answer -->
        <rect x="264" y="320" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="264" y="320" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="364" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Answer</text>
        <text x="364" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">streamed to you, with cards</text>

        <!-- Circuit breakers (guard) -->
        <rect x="600" y="320" width="200" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="600" y="320" width="200" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="700" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Circuit breakers</text>
        <text x="700" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">spend and request ceilings</text>

        <!-- Callout -->
        <text x="40" y="428" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Compaction keeps the context small; breakers stop a runaway. Neither touches a normal turn.</text>

        <!-- Legend -->
        <line x1="40" y1="448" x2="920" y2="448" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="476" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="466" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="144" y="475" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the model</text>
        <rect x="248" y="466" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="272" y="475" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">loop step</text>
        <rect x="376" y="466" width="16" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <text x="400" y="475" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">guard</text>
        <line x1="472" y1="471" x2="496" y2="471" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="504" y="475" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">guard attached to a step</text>
        <rect x="712" y="466" width="16" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <text x="736" y="475" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">trigger</text>
      </svg>
    </div>
  </div>
</body>
</html>
