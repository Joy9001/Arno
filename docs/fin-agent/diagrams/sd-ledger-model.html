<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The ledger, built on pgledger</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">ER · Fin-Agent system design, step 4</p>
    <h1>The ledger, built on pgledger</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-ledger-model-title sd-ledger-model-desc">
        <title id="sd-ledger-model-title">The ledger, built on pgledger</title>
        <desc id="sd-ledger-model-desc">Fin-Agent's ledger: each money movement is one pgledger call of balanced transfers between accounts, with editable labels for category and payee, and captures linking every chat message, photo, and statement line to its movement.</desc>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- pgledger zone -->
        <rect x="344" y="20" width="272" height="488" rx="8" fill="none" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="356" y="38" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">PGLEDGER · VENDORED · MIT</text>

        <!-- Relationships (drawn before boxes) -->
        <line x1="280" y1="80" x2="360" y2="80" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="280" y1="240" x2="360" y2="240" stroke="#bf4520" stroke-width="1.4"/>
        <line x1="600" y1="240" x2="680" y2="240" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="480" y1="144" x2="480" y2="208" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="480" y1="332" x2="480" y2="384" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="160" y1="318" x2="160" y2="384" stroke="#4f5d75" stroke-width="1.2"/>
        <line x1="800" y1="318" x2="800" y2="384" stroke="#4f5d75" stroke-width="1.2"/>

        <!-- Cardinality and relationship labels -->
        <g fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">
          <text x="290" y="74">1</text>
          <text x="352" y="74" text-anchor="end">1</text>
          <text x="290" y="234">1</text>
          <text x="352" y="234" text-anchor="end">N</text>
          <text x="608" y="234">1</text>
          <text x="672" y="234" text-anchor="end">0..1</text>
          <text x="488" y="158">1</text>
          <text x="488" y="202">N</text>
          <text x="488" y="346">1</text>
          <text x="488" y="378">2</text>
          <text x="168" y="332">1</text>
          <text x="168" y="378">N</text>
          <text x="808" y="332">N</text>
          <text x="808" y="378">1</text>
        </g>
        <rect x="288" y="248" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="320" y="257" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ONE CALL</text>
        <rect x="404" y="170" width="64" height="12" rx="2" fill="#f5f5f5"/>
        <text x="436" y="179" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FROM / TO</text>
        <rect x="396" y="352" width="72" height="12" rx="2" fill="#f5f5f5"/>
        <text x="432" y="361" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">OUT AND IN</text>

        <!-- accounts (ours) -->
        <rect x="40" y="48" width="240" height="124" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="48" width="240" height="124" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">accounts</text>
        <line x1="40" y1="76" x2="280" y2="76" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="52" y="92"># id</text>
          <text x="52" y="106">→ ledger_account_id</text>
          <text x="52" y="120">kind  bank, card, loan, person…</text>
          <text x="52" y="134">name, institution, last4</text>
          <text x="52" y="148">card cycle, loan terms</text>
          <text x="52" y="162">liquid, active</text>
        </g>

        <!-- pgledger_accounts -->
        <rect x="360" y="48" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="48" width="240" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="372" y="68" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">pgledger_accounts</text>
        <line x1="360" y1="76" x2="600" y2="76" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="372" y="92"># id  pgla_…</text>
          <text x="372" y="106">name, currency</text>
          <text x="372" y="120">balance  current</text>
          <text x="372" y="134">allow_negative_balance</text>
        </g>

        <!-- movements (focal) -->
        <rect x="40" y="208" width="240" height="110" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="208" width="240" height="110" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="52" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">movements</text>
        <line x1="40" y1="236" x2="280" y2="236" stroke="rgba(191,69,32,0.25)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="52" y="252"># id</text>
          <text x="52" y="266">date, description</text>
          <text x="52" y="280">kind  expense, split, EMI…</text>
          <text x="52" y="294">→ reverses_id  corrections</text>
          <text x="52" y="308">idempotency_key  retries</text>
        </g>

        <!-- pgledger_transfers -->
        <rect x="360" y="208" width="240" height="124" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="208" width="240" height="124" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="372" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">pgledger_transfers</text>
        <line x1="360" y1="236" x2="600" y2="236" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="372" y="252"># id  pglt_…</text>
          <text x="372" y="266">→ from_account_id</text>
          <text x="372" y="280">→ to_account_id</text>
          <text x="372" y="294">amount  paise, always &gt; 0</text>
          <text x="372" y="308">event_at  when it happened</text>
          <text x="372" y="322">metadata  {movement_id}</text>
        </g>

        <!-- transfer_labels (ours) -->
        <rect x="680" y="208" width="240" height="110" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="208" width="240" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="692" y="228" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">transfer_labels</text>
        <line x1="680" y1="236" x2="920" y2="236" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="692" y="252"># → transfer_id</text>
          <text x="692" y="266">→ category_id  editable</text>
          <text x="692" y="280">→ payee_id</text>
          <text x="692" y="294">expected_date  money owed</text>
          <text x="692" y="308">note</text>
        </g>

        <!-- captures (ours) -->
        <rect x="40" y="384" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="384" width="240" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="52" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">captures</text>
        <line x1="40" y1="412" x2="280" y2="412" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="52" y="428"># id, → movement_id</text>
          <text x="52" y="442">kind  chat, photo,</text>
          <text x="52" y="456">      statement line</text>
          <text x="52" y="470">ref, upi_ref</text>
        </g>

        <!-- pgledger_entries -->
        <rect x="360" y="384" width="240" height="96" rx="6" fill="#f5f5f5"/>
        <rect x="360" y="384" width="240" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="372" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">pgledger_entries</text>
        <line x1="360" y1="412" x2="600" y2="412" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="372" y="428"># id</text>
          <text x="372" y="442">→ transfer_id, → account_id</text>
          <text x="372" y="456">amount  − out, + in</text>
          <text x="372" y="470">balances by write order</text>
        </g>

        <!-- payees (ours) -->
        <rect x="680" y="384" width="240" height="110" rx="6" fill="#f5f5f5"/>
        <rect x="680" y="384" width="240" height="110" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="692" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">payees</text>
        <line x1="680" y1="412" x2="920" y2="412" stroke="rgba(45,49,66,0.15)" stroke-width="1"/>
        <g fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">
          <text x="692" y="428"># id, display_name</text>
          <text x="692" y="442">upi_id  ramesh@okaxis</text>
          <text x="692" y="456">match_hash  hashed identifiers</text>
          <text x="692" y="470">→ default_category_id</text>
          <text x="692" y="484">→ person_account_id</text>
        </g>

        <!-- Callout -->
        <text x="680" y="76" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Spending is transfers into the</text>
        <text x="680" y="92" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Spending account, grouped by</text>
        <text x="680" y="108" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">their labels. Recategorizing edits</text>
        <text x="680" y="124" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">a label, never the ledger.</text>

        <!-- Legend -->
        <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="542" width="16" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="144" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">one real money movement</text>
        <rect x="336" y="542" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="360" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Fin-Agent table</text>
        <rect x="496" y="542" width="16" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="520" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">pgledger table, append-only</text>
        <text x="736" y="551" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace"># key   → reference</text>
      </svg>
    </div>
  </div>
</body>
</html>
