<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-import-pipeline-title sd-import-pipeline-desc" id="sd-import-pipeline-root">
        <title id="sd-import-pipeline-title">The agent learns each statement layout once</title>
        <desc id="sd-import-pipeline-desc">A statement is read by its contents; a known layout reruns its saved parser with no LLM, and a new layout starts a parse run with no write tools, where the agent writes a parser in Monty. Checks gate both paths, you approve the review screen, and only then is the parser saved.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sd-import-pipeline-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-import-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-import-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-import-pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="sd-import-pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 300,80 V 104" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 300,168 V 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 388,232 H 520" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 300,272 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 640,264 V 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 460,348 H 564" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 716,348 H 760" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 640,392 V 420 Q 640,428 632,428 H 388 Q 380,428 380,420 V 392" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 220,392 V 464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>
        <path d="M 836,392 V 464" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-import-pipeline-arrow)"/>

        <!-- Arrow labels -->
        <rect x="440" y="212" width="28" height="12" fill="#f5f5f5"/>
        <text x="454" y="221" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">YES</text>
        <rect x="308" y="282" width="24" height="12" fill="#f5f5f5"/>
        <text x="320" y="291" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO</text>
        <rect x="718" y="328" width="40" height="12" fill="#f5f5f5"/>
        <text x="738" y="337" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">PASS</text>
        <rect x="472" y="408" width="88" height="12" fill="#f5f5f5"/>
        <text x="516" y="417" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">FAIL: REPAIR</text>
        <rect x="228" y="422" width="60" height="12" fill="#f5f5f5"/>
        <text x="258" y="431" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">GIVES UP</text>

        <!-- Start -->
        <rect x="200" y="40" width="200" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="200" y="40" width="200" height="40" rx="20" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="300" y="64" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Statement uploaded</text>

        <!-- Read -->
        <rect x="160" y="104" width="280" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="160" y="104" width="280" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="176" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Read the file</text>
        <text x="176" y="144" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">by its contents, not its extension;</text>
        <text x="176" y="157" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a password goes on the import card</text>

        <!-- Decision: known -->
        <polygon points="300,192 388,232 300,272 212,232" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="300" y="229" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Layout</text>
        <text x="300" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">known?</text>

        <!-- Saved parser -->
        <rect x="520" y="200" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="200" width="240" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="536" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Rerun the saved parser</text>
        <text x="536" y="240" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the server runs it in Monty</text>
        <rect x="700" y="210" width="48" height="14" rx="2" fill="#f5f5f5" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.30"/>
        <text x="724" y="220" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NO LLM</text>

        <!-- Parse run (focal) -->
        <rect x="140" y="304" width="320" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="140" y="304" width="320" height="88" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="156" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Parse run: the agent, no write tools</text>
        <text x="156" y="343" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">a skill guides it to write a parser in Monty;</text>
        <text x="156" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the server reruns the script from its text;</text>
        <text x="156" y="369" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">no text layer: VISION reads the pages</text>

        <!-- Decision: checks -->
        <polygon points="640,304 716,348 640,392 564,348" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="640" y="345" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Checks</text>
        <text x="640" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">pass?</text>

        <!-- Review -->
        <rect x="760" y="304" width="160" height="88" rx="6" fill="#f5f5f5"/>
        <rect x="760" y="304" width="160" height="88" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="776" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Review screen</text>
        <text x="776" y="349" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">dedupe, reconcile;</text>
        <text x="776" y="362" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">you approve</text>

        <!-- Ends -->
        <rect x="120" y="464" width="200" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="120" y="464" width="200" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="220" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Fails, and says why</text>

        <rect x="752" y="464" width="168" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="752" y="464" width="168" height="40" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="836" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Commit; save the parser</text>

        <!-- Callout -->
        <text x="352" y="464" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">Balances alone miss wrong dates and narrations, so the</text>
        <text x="352" y="481" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">checks add the period, the column headers, the row count,</text>
        <text x="352" y="498" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif">and the ledger's opening balance.</text>

        <!-- Legend -->
        <line x1="40" y1="532" x2="920" y2="532" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="550" width="16" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="144" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">you</text>
        <rect x="192" y="550" width="16" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="216" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">the model picks steps</text>
        <rect x="372" y="550" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="396" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">code</text>
        <line x1="456" y1="555" x2="480" y2="555" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="488" y="559" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">back to the agent</text>
      </svg>
