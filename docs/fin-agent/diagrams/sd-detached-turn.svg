<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 388" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sd-detached-turn-title sd-detached-turn-desc" id="sd-detached-turn-root">
        <title id="sd-detached-turn-title">A turn outlives its connection</title>
        <desc id="sd-detached-turn-desc">The client sends a message, which starts the run as its own task. The run writes chunks to an in-memory buffer, and any client can read that buffer from the start, so leaving stops the reading, not the run. The Stop button reaches the run through a cancellation token. Every ending saves both records. If the process crashes, nothing can save them, so a check at boot finds the unfinished turn and adds a note to the thread.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #sd-detached-turn-root { --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #sd-detached-turn-root { font-family: var(--font-sans); color: var(--color-ink); }
      #sd-detached-turn-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#sd-detached-turn-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="sd-detached-turn-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="sd-detached-turn-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Arrows (drawn before boxes) -->
        <path d="M 184,116 H 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-detached-turn-arrow)"/>
        <path d="M 184,156 H 300" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-detached-turn-arrow)"/>
        <path d="M 390,180 V 228" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-detached-turn-arrow)"/>
        <path d="M 300,264 H 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sd-detached-turn-arrow)"/>
        <path d="M 480,104 H 660" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#sd-detached-turn-arrow-accent)"/>
        <path d="M 480,152 H 552 Q 560,152 560,160 V 256 Q 560,264 568,264 H 660" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sd-detached-turn-arrow)"/>
        <path d="M 780,228 V 156" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#sd-detached-turn-arrow)"/>

        <!-- Arrow labels -->
        <rect x="208" y="94" width="68" height="12" fill="#f5f5f5"/>
        <text x="242" y="103" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NEW MESSAGE</text>
        <rect x="224" y="134" width="36" height="12" fill="#f5f5f5"/>
        <text x="242" y="143" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STOP</text>
        <rect x="398" y="198" width="44" height="12" fill="#f5f5f5"/>
        <text x="420" y="207" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CHUNKS</text>
        <rect x="200" y="242" width="84" height="12" fill="#f5f5f5"/>
        <text x="242" y="251" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">STREAM, REPLAY</text>
        <rect x="538" y="82" width="64" height="12" fill="#f5f5f5"/>
        <text x="570" y="91" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ANY ENDING</text>
        <rect x="568" y="200" width="36" height="12" fill="#f5f5f5"/>
        <text x="586" y="209" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CRASH</text>
        <rect x="788" y="186" width="32" height="12" fill="#f5f5f5"/>
        <text x="804" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">NOTE</text>

        <!-- Client (input) -->
        <rect x="40" y="76" width="144" height="224" rx="6" fill="#f5f5f5"/>
        <rect x="40" y="76" width="144" height="224" rx="6" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="112" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Client</text>
        <text x="112" y="194" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">can leave and come</text>
        <text x="112" y="207" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">back at any time</text>

        <!-- Run (focal) -->
        <rect x="300" y="76" width="180" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="76" width="180" height="104" rx="6" fill="#bf4520" stroke="#bf4520" stroke-width="1.2" fill-opacity="0.08"/>
        <text x="390" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">The run's own task</text>
        <text x="390" y="134" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">keeps going if you leave;</text>
        <text x="390" y="147" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one at a time per thread</text>

        <!-- Buffer -->
        <rect x="300" y="228" width="180" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="300" y="228" width="180" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="390" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Buffer, in memory</text>
        <text x="390" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">any client reads it from</text>
        <text x="390" y="287" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">the start</text>

        <!-- Records (store) -->
        <rect x="660" y="52" width="260" height="104" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="52" width="260" height="104" rx="6" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="790" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Both records saved</text>
        <text x="790" y="110" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">on_complete, on_cancel, or</text>
        <text x="790" y="123" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">capture_run_messages()</text>

        <!-- Boot check -->
        <rect x="660" y="228" width="260" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="660" y="228" width="260" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="790" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Check at boot</text>
        <text x="790" y="274" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">run_started_at still set: the</text>
        <text x="790" y="287" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">thread gets a note</text>

        <!-- Legend -->
        <line x1="40" y1="332" x2="920" y2="332" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.10"/>
        <text x="40" y="360" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="120" y="350" width="16" height="10" rx="2" fill="#4f5d75" stroke="#5a6580" stroke-width="1" fill-opacity="0.10"/>
        <text x="144" y="359" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">client</text>
        <rect x="208" y="350" width="16" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="232" y="359" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">server step</text>
        <rect x="328" y="350" width="16" height="10" rx="2" fill="#bf4520" stroke="#bf4520" stroke-width="1" fill-opacity="0.08"/>
        <text x="352" y="359" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">what outlives the connection</text>
        <rect x="544" y="350" width="16" height="10" rx="2" fill="#2d3142" stroke="#4f5d75" stroke-width="1" fill-opacity="0.05"/>
        <text x="568" y="359" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Postgres</text>
        <line x1="648" y1="355" x2="672" y2="355" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="680" y="359" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">only after a crash</text>
      </svg>
