# GPU override for the optional `local-stt` profile. Run
# `docker compose -f compose.yaml -f compose.gpu.yaml --profile local-stt up -d`, or set
# `COMPOSE_FILE=compose.yaml:compose.gpu.yaml` in .env (use `;` as the separator on Windows).
# Needs the NVIDIA driver, plus the NVIDIA Container Toolkit on Linux (built in on Docker Desktop).
# The CPU target is the default; this swaps in the CUDA target built from the pinned official
# image, which includes compute capability 7.5 for the GTX 1650. CUDA 13 needs driver 580+.
services:
  whisper:
    build:
      context: ./deploy/whisper
      target: gpu
    image: arno-whisper:1.9.5-gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
