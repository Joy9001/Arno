<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title">
  <title id="title">Fin-Agent</title>
  <defs>
    <!-- The orb: the app's iris colours, lit from the top left like the live orb. -->
    <linearGradient id="iris" x1="0.1" y1="0.9" x2="0.9" y2="0.1">
      <stop offset="0" stop-color="#2b59ff"/>
      <stop offset="0.28" stop-color="#1ec8a5"/>
      <stop offset="0.5" stop-color="#3ee07f"/>
      <stop offset="0.68" stop-color="#d4ff3a"/>
      <stop offset="0.84" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#ff6a2b"/>
    </linearGradient>
    <radialGradient id="light" cx="0.32" cy="0.26" r="0.42">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.7" cy="0.82" r="0.55">
      <stop offset="0" stop-color="#0e0f0c" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#0e0f0c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="24" cy="24" r="22" fill="url(#iris)"/>
  <circle cx="24" cy="24" r="22" fill="url(#shade)"/>
  <circle cx="24" cy="24" r="22" fill="url(#light)"/>
</svg>
