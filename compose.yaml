name: fin-agent

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fin_agent
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<major>/; mounting data/ is
      # rejected at boot.
      - db-data:/var/lib/postgresql
    # Published on loopback for development (tests, psql). Not reachable from the tailnet.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fin_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  api:
    build: .
    image: fin-agent-api:local
    restart: unless-stopped
    env_file:
      # Optional: Compose still requires POSTGRES_PASSWORD, so a missing .env fails loudly.
      - path: .env
        required: false
    environment:
      # Inside Compose the database is `db`, not the loopback address in .env.
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/fin_agent
      FIN_AGENT_WEB_DIR: /app/web/dist
      FIN_AGENT_AUTO_MIGRATE: "1"
    ports:
      # Loopback only. `tailscale serve --bg` proxies HTTPS on the tailnet to this port.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  db-data:
