name: arno

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    logging: *default-logging
    # Assumes SSD/NVMe storage; use 4 on spinning disks.
    command: ["postgres", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_PASSWORD: ${POSTGRES_PASSWORD}
      APP_DB: arno
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<major>/; mounting data/ is
      # rejected at boot.
      - db-data:/var/lib/postgresql
      - ./deploy/app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    # Published on loopback for development (tests, psql). Not reachable from the tailnet.
    ports:
      - "127.0.0.1:${ARNO_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d arno"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  api:
    build: .
    image: ghcr.io/joy9001/arno:${ARNO_VERSION:-0.4.2}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      # Optional: Compose still requires POSTGRES_PASSWORD, so a missing .env fails loudly.
      - path: ${ARNO_ENV_FILE:-.env}
        required: false
    environment:
      # Inside Compose the database is `db`, not the loopback address in .env.
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/arno
      ARNO_WEB_DIR: /app/web/dist
      ARNO_AUTO_MIGRATE: "1"
      ARNO_PRE_MIGRATION_DIR: /app/pre-migration
      ARNO_TASKS_DIR: /app/tasks
      ARNO_SANDBOX_URL: http://sandbox:8001
      # Traces go to Phoenix over OTLP/HTTP via the stock OpenTelemetry SDK. The base URL is the
      # Phoenix address (the exporter appends /v1/traces); empty means tracing is off. This Compose
      # Phoenix requires authentication, so the headers carry its admin secret as the bearer
      # unless OTEL_EXPORTER_OTLP_HEADERS overrides it. `--profile obs` plus the endpoint in
      # .env.example turns tracing on.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-Authorization=Bearer%20${PHOENIX_ADMIN_SECRET:-}}
      OTEL_RESOURCE_ATTRIBUTES: ${OTEL_RESOURCE_ATTRIBUTES:-openinference.project.name=arno}
      OTEL_SERVICE_NAME: arno
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      # The shared env_file also contains backend credentials. The app gets only the single
      # bearer credential above, never these Phoenix values under their own names.
      PHOENIX_SECRET: ""
      PHOENIX_ADMIN_SECRET: ""
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ""
      # Daily backup (jobs/backup.py) and arno restore.
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
    volumes:
      # A dump from before each migration. The image creates this path owned by the API user.
      - pre-migration-data:/app/pre-migration
      # The parser subagent's task records. The step store in Postgres holds each run's steps.
      - tasks-data:/app/tasks
      # The default local restic repository for the daily backup and `arno restore`.
      - backup-data:/backups
    ports:
      # Loopback only. `tailscale serve --bg` proxies HTTPS on the tailnet to this port.
      - "127.0.0.1:${ARNO_API_PORT:-8000}:8000"
    networks: [default, sandbox-net]
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Runs model-written code. Isolated on an internal network (no internet, no route to the
  # database), read-only, resource-capped, and given no secrets.
  sandbox:
    build: ./sandbox
    restart: unless-stopped
    logging: *default-logging
    read_only: true
    tmpfs: ["/tmp:size=128m"]
    mem_limit: "512m"
    cpus: "1.0"
    networks: [sandbox-net]

  # `docker compose --profile local-llm up`: local inference for the CHAT role.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local-llm"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Must match LLM_CONTEXT_WINDOW; otherwise Ollama truncates long histories silently.
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT_WINDOW:-128000}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  # `docker compose --profile obs up`: stock Phoenix (Elastic License 2.0, not part of the Arno
  # image) with its default local SQLite store.
  phoenix:
    image: arizephoenix/phoenix:21.0@sha256:1f9a144a5357b4973e93a15718f050247cb7a4ee7b7c6c06ecb91b5eed3fbaad
    profiles: ["obs"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      PHOENIX_HOST: "::"
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:-}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:-}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:-}
      PHOENIX_ENABLE_STRONG_PASSWORD_POLICY: "true"
      PHOENIX_CSRF_TRUSTED_ORIGINS: ${PHOENIX_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:6006}
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    ports:
      # Loopback only. Reaching it over the tailnet needs a deliberate change and its login.
      - "127.0.0.1:${PHOENIX_UI_PORT:-6006}:6006"
    stop_grace_period: 30s

networks:
  default: {}
  sandbox-net:
    internal: true

volumes:
  db-data:
  backup-data:
  pre-migration-data:
  tasks-data:
  ollama-data:
  phoenix-data:
