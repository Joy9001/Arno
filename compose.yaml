name: fin-agent

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: fin_agent
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<major>/; mounting data/ is
      # rejected at boot.
      - db-data:/var/lib/postgresql
    # Published on loopback for development (tests, psql). Not reachable from the tailnet.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d fin_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  api:
    build: .
    image: fin-agent-api:local
    restart: unless-stopped
    env_file:
      # Optional: Compose still requires POSTGRES_PASSWORD, so a missing .env fails loudly.
      - path: .env
        required: false
    environment:
      # Inside Compose the database is `db`, not the loopback address in .env.
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/fin_agent
      FIN_AGENT_WEB_DIR: /app/web/dist
      FIN_AGENT_AUTO_MIGRATE: "1"
    ports:
      # Loopback only. `tailscale serve --bg` proxies HTTPS on the tailnet to this port.
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    image: fin-agent-backup:local
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Its own role: SELECT for pg_dump, INSERT into backup_runs only.
      DATABASE_URL: postgresql://backup:${BACKUP_PASSWORD:?set BACKUP_PASSWORD in .env}@db:5432/fin_agent
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-86400}
    volumes:
      - backup-data:/backups
    depends_on:
      db:
        condition: service_healthy
      api:
        # The API boot sets the backup role's password from BACKUP_PASSWORD.
        condition: service_healthy
    stop_grace_period: 30s

  # `docker compose --profile local-llm up`: local inference for the CHAT role.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local-llm"]
    restart: unless-stopped
    environment:
      # Must match LLM_CONTEXT_WINDOW; otherwise Ollama truncates long histories silently.
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT_WINDOW:-128000}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  # `docker compose --profile traces up`: Phoenix on its own database and role.
  phoenix-init:
    image: postgres:18.6
    profiles: ["traces"]
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      PGHOST: db
      PGUSER: app
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: fin_agent
      PHOENIX_PASSWORD: ${PHOENIX_PASSWORD:-phoenix-local-only}
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        psql -v ON_ERROR_STOP=1 <<'SQL'
        DO $$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'phoenix') THEN
            CREATE ROLE phoenix LOGIN PASSWORD '${PHOENIX_PASSWORD:-phoenix-local-only}';
          ELSE
            ALTER ROLE phoenix PASSWORD '${PHOENIX_PASSWORD:-phoenix-local-only}';
          END IF;
        END
        $$;
        SQL
        if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname='phoenix'" | grep -q 1; then
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE phoenix OWNER phoenix"
          psql -v ON_ERROR_STOP=1 -c "REVOKE CONNECT ON DATABASE phoenix FROM PUBLIC"
        fi

  phoenix:
    image: arizephoenix/phoenix:21.0
    profiles: ["traces"]
    restart: unless-stopped
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:${PHOENIX_PASSWORD:-phoenix-local-only}@db:5432/phoenix
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "90"
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    ports:
      # Loopback only, like the app. Reaching it over the tailnet needs its login.
      - "127.0.0.1:6006:6006"
    depends_on:
      phoenix-init:
        condition: service_completed_successfully

volumes:
  db-data:
  backup-data:
  ollama-data:
  phoenix-data:
