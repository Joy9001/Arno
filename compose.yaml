name: arno

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    logging: *default-logging
    # Assumes SSD/NVMe storage; use 4 on spinning disks.
    command: ["postgres", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: arno
      PHOENIX_PASSWORD: ${PHOENIX_PASSWORD:-}
    volumes:
      # Postgres 18 images store data under /var/lib/postgresql/<major>/; mounting data/ is
      # rejected at boot.
      - db-data:/var/lib/postgresql
      - ./deploy/phoenix-db.sh:/docker-entrypoint-initdb.d/phoenix-db.sh:ro
    # Published on loopback for development (tests, psql). Not reachable from the tailnet.
    ports:
      - "127.0.0.1:${ARNO_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d arno"]
      interval: 5s
      timeout: 5s
      retries: 10
    stop_grace_period: 30s

  api:
    build: .
    image: ghcr.io/joy9001/arno:${ARNO_VERSION:-0.2.0}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      # Optional: Compose still requires POSTGRES_PASSWORD, so a missing .env fails loudly.
      - path: ${ARNO_ENV_FILE:-.env}
        required: false
    environment:
      # Inside Compose the database is `db`, not the loopback address in .env.
      DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD}@db:5432/arno
      ARNO_WEB_DIR: /app/web/dist
      ARNO_AUTO_MIGRATE: "1"
      ARNO_PRE_MIGRATION_DIR: /app/pre-migration
      ARNO_TASKS_DIR: /app/tasks
      # Native Pydantic AI traces go straight to Phoenix over OTLP/HTTP. This Compose Phoenix
      # requires authentication. By default the local Phoenix admin secret is the bearer token,
      # so a normal start exports with no extra provisioning step. PHOENIX_API_KEY overrides it
      # when the operator has a real Phoenix API key.
      PHOENIX_COLLECTOR_ENDPOINT: ${PHOENIX_COLLECTOR_ENDPOINT:-http://phoenix:6006/v1/traces}
      PHOENIX_PROJECT_NAME: ${PHOENIX_PROJECT_NAME:-arno}
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-${PHOENIX_ADMIN_SECRET:-}}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      # The shared env_file also contains backend credentials. The app gets only the single
      # bearer credential above, never these Phoenix values under their own names.
      PHOENIX_SECRET: ""
      PHOENIX_ADMIN_SECRET: ""
      PHOENIX_PASSWORD: ""
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ""
    volumes:
      # A dump from before each migration. The image creates this path owned by the API user.
      - pre-migration-data:/app/pre-migration
      # The parser subagent's task records. The step store in Postgres holds each run's steps.
      - tasks-data:/app/tasks
      # Read-only access to the default restic repository so `arno restore` works with the
      # local volume. Off-site repositories are read through restic directly.
      - backup-data:/backups:ro
    ports:
      # Loopback only. `tailscale serve --bg` proxies HTTPS on the tailnet to this port.
      - "127.0.0.1:${ARNO_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  backup:
    build:
      context: .
      dockerfile: backup/Dockerfile
    image: ghcr.io/joy9001/arno-backup:${ARNO_VERSION:-0.2.0}
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - path: ${ARNO_ENV_FILE:-.env}
        required: false
    environment:
      # Its own role: SELECT for pg_dump, INSERT into backup_runs only.
      DATABASE_URL: postgresql://backup:${BACKUP_PASSWORD:?set BACKUP_PASSWORD in .env}@db:5432/arno
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/backups/restic}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set RESTIC_PASSWORD in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-3600}
      BACKUP_MAX_AGE_SECONDS: ${BACKUP_MAX_AGE_SECONDS:-86400}
    volumes:
      - backup-data:/backups
    depends_on:
      db:
        condition: service_healthy
      api:
        # The API boot sets the backup role's password from BACKUP_PASSWORD.
        condition: service_healthy
    stop_grace_period: 30s

  # `docker compose --profile local-llm up`: local inference for the CHAT role.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local-llm"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      # Must match LLM_CONTEXT_WINDOW; otherwise Ollama truncates long histories silently.
      OLLAMA_CONTEXT_LENGTH: ${LLM_CONTEXT_WINDOW:-128000}
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"

  # `docker compose --profile local-stt up`: local speech-to-text for the STT role.
  # speaches returns 404 until a model is installed; PRELOAD_MODELS installs STT_MODEL into the
  # volume at startup (once). Needs 0.9.0-rc.3 or newer.
  speaches:
    image: ghcr.io/speaches-ai/speaches:0.9.0-rc.3-cpu
    profiles: ["local-stt"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      PRELOAD_MODELS: '["${STT_MODEL:-Systran/faster-whisper-small}"]'
      # -1 keeps the model loaded; the 300 s default reloaded it into VRAM (~75 s) after any idle gap.
      STT_MODEL_TTL: "-1"
      ENABLE_UI: "false"
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    volumes:
      - speaches-data:/home/ubuntu/.cache/huggingface
    ports:
      # Host development only. The API inside Compose reaches it at http://speaches:8000/v1.
      - "127.0.0.1:8001:8000"

  phoenix:
    # Arno builds this one from deploy/phoenix-cost: stock Phoenix 21.0 ignores
    # a supplied llm.cost.*, prices from its own catalog, and reports an
    # unknown cost as $0. The patch keeps the supplied observation, its source
    # and revision, and an unresolved count beside every total. Phoenix is
    # Elastic License 2.0 and is not part of the Arno image.
    build:
      context: ./deploy/phoenix-cost
    image: arno-phoenix-cost:21.0.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:${PHOENIX_PASSWORD:-}@db:5432/phoenix
      PHOENIX_PASSWORD: ${PHOENIX_PASSWORD:-}
      # Auth is explicit; the startup guard rejects missing credentials.
      PHOENIX_HOST: "::"
      PHOENIX_ENABLE_AUTH: "true"
      PHOENIX_SECRET: ${PHOENIX_SECRET:-}
      PHOENIX_ADMIN_SECRET: ${PHOENIX_ADMIN_SECRET:-}
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:-}
      PHOENIX_ENABLE_STRONG_PASSWORD_POLICY: "true"
      PHOENIX_CSRF_TRUSTED_ORIGINS: ${PHOENIX_CSRF_TRUSTED_ORIGINS:-http://127.0.0.1:6006}
      PHOENIX_WORKING_DIR: /data
    volumes:
      - phoenix-data:/data
    ports:
      # Loopback only. Reaching it over the tailnet needs a deliberate change and its login.
      - "127.0.0.1:${PHOENIX_UI_PORT:-6006}:6006"
    entrypoint: ["/usr/bin/python3.13", "-c"]
    command:
      - |
        import os, sys
        required = ("PHOENIX_PASSWORD", "PHOENIX_SECRET", "PHOENIX_ADMIN_SECRET", "PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD")
        missing = [name for name in required if not os.environ.get(name)]
        if missing:
            sys.exit("Phoenix cannot start: missing " + ", ".join(missing))
        os.execv(sys.executable, [sys.executable, "-m", "phoenix.server.main", "serve"])
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

volumes:
  db-data:
  backup-data:
  pre-migration-data:
  tasks-data:
  ollama-data:
  speaches-data:
  phoenix-data:
