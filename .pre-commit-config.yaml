# Mirrors .github/workflows/ci.yml and release.yml so failures show up before the push.
# Install once:  uv tool install pre-commit && pre-commit install
# Local hooks run the locked tool versions (uv run / pnpm), so they can't drift from CI.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      # --- every commit: fast ---
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
      - id: pyrefly
        name: pyrefly type check
        # Whole project: a signature change breaks callers in files the commit didn't touch.
        entry: uv run pyrefly check
        language: system
        # Its config lives in pyproject.toml, and the lockfile pins the checker and the stubs.
        files: (\.pyi?|pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: uv-lock
        name: uv lock is in sync
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: web-lint
        name: web eslint + tsc
        entry: pnpm --dir web run --silent lint
        language: system
        files: ^web/
        pass_filenames: false

      # --- every push: what CI would catch ---
      - id: web-typecheck
        name: web typecheck
        entry: pnpm --dir web run --silent typecheck
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]
      - id: web-build
        name: web build
        entry: pnpm --dir web build
        language: system
        files: ^web/
        pass_filenames: false
        stages: [pre-push]
      - id: web-answer-contract
        name: web answer contract
        entry: pnpm --dir web run --silent test:answers
        language: system
        files: ^(web/src/|web/scripts/|tests/fixtures/presentation_contract\.py)
        pass_filenames: false
        stages: [pre-push]
      - id: web-interaction-tests
        name: web interaction tests
        entry: pnpm --dir web run --silent test:web
        language: system
        files: ^web/(src/|vitest\.config\.ts|package\.json|pnpm-lock\.yaml|tsconfig\.json)
        pass_filenames: false
        stages: [pre-push]
      - id: pytest
        name: pytest (needs a *_test DATABASE_URL)
        # ponytail: pytest needs a scratch Postgres, so it is skipped loudly without one.
        # A Python one-liner keeps this readable on Windows, without Git Bash on PATH.
        entry: >-
          uv run python -c "import os,sys,subprocess;
          ok=os.environ.get('DATABASE_URL','').endswith('_test');
          ok or print('skipped: set DATABASE_URL to a *_test database to run pytest');
          sys.exit(0 if not ok else subprocess.call(['uv','run','pytest','-q']))"
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
      - id: release-tag
        name: tag matches pyproject version (release.yml)
        entry: >-
          python -c "import os,sys,tomllib;
          v=tomllib.load(open('pyproject.toml','rb'))['project']['version'];
          r=os.environ.get('PRE_COMMIT_REMOTE_BRANCH','');
          bad=r.startswith('refs/tags/v') and r!='refs/tags/v'+v;
          bad and print(r+' does not match pyproject version '+v);
          sys.exit(bad)"
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
